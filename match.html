<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match LIVE - FULL FINAL ALL LEAGUES</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#000;font-weight:900;font-size:18px}
.header a{background:#fff;color:#000;padding:6px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:900}
.scorebox{background:#111;padding:25px 15px;text-align:center;border-bottom:3px solid #00c853}
.league{color:#888;font-size:13px}
.teams{font-size:28px;font-weight:900;margin:12px 0;line-height:34px}
.score{font-size:64px;font-weight:900;color:#00ff66}
.live{color:#ff3b30;font-weight:900;font-size:20px}
.tabs{display:flex;background:#121212;position:sticky;top:0;z-index:10}
.tabs button{flex:1;background:#121212;color:#888;border:0;padding:16px;font-weight:900;font-size:13px}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00c853;background:#1a1a1a}
.content{padding:10px}
.card{background:#1a1a1a;border-radius:14px;margin:10px 0;overflow:hidden;border:1px solid #222}
.head{background:#222;color:#00ff66;padding:10px 14px;font-weight:900;font-size:12px}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:13px;align-items:center}
.greenBar{background:#006400;color:#fff;padding:10px;text-align:center;font-weight:900;font-size:13px}
.blackHead{background:#000;color:#fff;padding:8px 14px;font-weight:900;border-left:3px solid #00c853;font-size:12px}
.stand-table{width:100%;border-collapse:collapse;background:#fff;color:#000}
.stand-table th{background:#006400;color:#fff;padding:8px 4px;font-size:11px;text-align:center}
.stand-table td{padding:8px 4px;font-size:13px;border-bottom:1px solid #eee;text-align:center}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore</span><a href="/">← Back</a></div>
<div class="scorebox" id="top">Loading...</div>
<div class="tabs">
<button id="b1" class="active" onclick="showTab('details',this)">DETAILS</button>
<button onclick="showTab('stats',this)">STATS</button>
<button onclick="showTab('table',this)">STANDINGS</button>
<button onclick="showTab('h2h',this)">H2H</button>
</div>
<div id="details" class="content"></div>
<div id="stats" class="content" style="display:none"></div>
<div id="table" class="content" style="display:none"></div>
<div id="h2h" class="content" style="display:none"></div>
<script>
function showTab(n,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.content').forEach(c=>c.style.display='none');document.getElementById(n).style.display='block';}
function pick(o,ks){ if(!o) return null; for(let k of ks){ let v=o[k]; if(v!==undefined&&v!==null&&v!==''&&String(v).toLowerCase()!=='undefined'&&String(v).toLowerCase()!=='null') return v; } return null; }
function toNum(v){ let n=Number(v); return isNaN(n)?0:n; }

async function load(){
 let params=new URLSearchParams(location.search);
 let id=params.get('id')||sessionStorage.getItem('mid')||localStorage.getItem('mid');
 let m=null;
 try{ let raw=sessionStorage.getItem('selected_match')||localStorage.getItem('selected_match'); if(raw){ let p=JSON.parse(raw); if(String(p.id)===String(id)) m=p; } }catch(e){}

 if(!m){
  try{
   let r=await fetch(`/api/fixture?id=${id}`);
   if(r.ok){
    let j=await r.json(); let f=j.fixture||j.data||j||{};
    let hh = pick(f, ['ht_home','home_ht','ht_home_score','home_ht_score','halftime_home','ht_h','home_score_ht']) ?? pick(f.score?.halftime||{},['home','h']) ?? null;
    let aa = pick(f, ['ht_away','away_ht','ht_away_score','away_ht_score','halftime_away','ht_a','away_score_ht']) ?? pick(f.score?.halftime||{},['away','a']) ?? null;
    m={
      id:f.id||id,
      home_team:f.home_team||f.homeTeam?.name||f.teams?.home?.name||'Home',
      away_team:f.away_team||f.awayTeam?.name||f.teams?.away?.name||'Away',
      league_name:f.league_name||f.league?.name||'League',
      league_zone:f.league_zone||f.league?.country||'World',
      home_score: pick(f, ['home_score','homeScore']) ?? f.score?.fulltime?.home ?? f.score?.home ?? null,
      away_score: pick(f, ['away_score','awayScore']) ?? f.score?.fulltime?.away ?? f.score?.away ?? null,
      home_ht: hh, away_ht: aa,
      status:f.status||'FT', minute:f.minute||'', league_id:f.league_id||f.league?.id||'0',
      datetime:f.datetime||f.date||''
    };
   }
  }catch(e){}
 }
 if(!m){ m={id,home_team:'AC Milan',away_team:'Ferencvaros',league_name:'UEFA Europa League',league_zone:'Europe',home_score:0,away_score:2,home_ht:0,away_ht:0,status:'FT',league_id:'28',datetime:'2026-11-05 18:45:00'}; }

 // TEAM ABBR FOR ALL LEAGUES
 function teamAbbr(name){ if(!name) return 'HOM'; return name.trim().substring(0,3).toUpperCase(); }
 let homeAbbr = teamAbbr(m.home_team);
 let awayAbbr = teamAbbr(m.away_team);

 let events=[]; try{ let r=await fetch(`/api/events?id=${id}`); let j=await r.json(); events=j.data||j.events||[]; }catch(e){}

 // FIX FOR ALL LEAGUES - HT FROM EVENTS
 let hasHT = (m.home_ht!==null && m.home_ht!=='' && !isNaN(Number(m.home_ht)) && m.away_ht!==null && m.away_ht!=='' && !isNaN(Number(m.away_ht)));
 let calcH=0, calcA=0;
 if(!hasHT && events.length){
   events.forEach(ev=>{
     let min=parseInt(ev.minute||0); let type=(ev.event_type||ev.type||'').toLowerCase();
     if(type.includes('goal') && min>0 && min<=45){
       let side=(ev.team_side||ev.team||'').toLowerCase();
       if(side.includes('home')||side==='h') calcH++; else calcA++;
     }
   });
 }

 let hHT = hasHT ? toNum(m.home_ht) : calcH;
 let aHT = hasHT ? toNum(m.away_ht) : calcA;
 let isScheduled = (m.status==='Scheduled'||m.status==='NS'|| (m.home_score===null && m.away_score===null));
 let hS = isScheduled?0:toNum(m.home_score), aS = isScheduled?0:toNum(m.away_score);
 let htT = isScheduled ? '-' : `${hHT}-${aHT}`;
 let sT = isScheduled ? '-' : `${hS-hHT}-${aS-aHT}`;
 let fullT = isScheduled ? 'VS' : `${hS}-${aS} (${htT},${sT})`;
 let scoreDisplay = isScheduled ? 'VS' : `${hS} - ${aS}`;
 let statusTxt = isScheduled ? 'Scheduled' : `Finished - FT - ${fullT}`;
 let statusColor = isScheduled ? '#888' : '#00ff66';
 if(m.status==='LIVE'){ statusTxt=`Live ${m.minute} - ${fullT}`; statusColor='#ff3b30'; }

 document.getElementById('top').innerHTML=`<div class="league">${m.league_zone} - ${m.league_name}</div><div class="teams">${m.home_team}<br><span style="color:#555">VS</span><br>${m.away_team}</div><div class="score">${scoreDisplay}</div><div class="live" style="color:${statusColor}">${statusTxt}</div><div style="color:#666;font-size:11px">${m.datetime} | ID:${id} | ${homeAbbr} vs ${awayAbbr}</div>`;

 function icon(t){ t=(t||'').toLowerCase(); if(t.includes('yellow')) return '🟨'; if(t.includes('red')) return '🟥'; if(t.includes('goal')) return '⚽'; if(t.includes('substitut')) return '🔄'; return '•'; }
 function getOut(e){ return e.player_out || e.related_player || e.out_player || e.second_player || e.player2 || e.sub_out || e.assist || e.player_out_name || ''; }
 function getIn(e){ return e.player_in || e.player_name || e.player || e.in_player || e.sub_in || ''; }
 function renderEv(list){
   if(!list.length) return `<div class="row" style="color:#666">No events - ${statusTxt}</div>`;
   return list.map(e=>{
     let type=e.event_type||e.type||'';
     let min=(e.minute||'').toString().replace("'","").replace('"','');
     let inName=getIn(e);
     let outName=getOut(e);
     let side=(e.team_side||e.team||'').toString().toLowerCase();
     let isHome = side.includes('home') || side==='h';
     let abbr = isHome ? homeAbbr : awayAbbr;
     // If side empty, guess from team field
     if(!e.team_side && !e.team){ abbr = homeAbbr; }
     let isSub=type.toLowerCase().includes('substitut');
     let txt='';
     if(isSub){
       if(outName) txt=`${inName} (${outName}) [${abbr}]`;
       else txt=`${inName} [${abbr}]`;
     } else if(type.toLowerCase().includes('goal')){
       txt=`${inName} goal [${abbr}]`;
     } else {
       txt=`${inName} ${type.replace('_',' ')} [${abbr}]`;
     }
     return `<div class="row"><span>${min}' ${icon(type)} ${txt}</span><span style="font-weight:900;color:#00c853">${abbr}</span></div>`;
   }).join('');
 }
 let ev1=events.filter(e=>parseInt(e.minute||0)<=45), ev2=events.filter(e=>parseInt(e.minute||0)>45);
 document.getElementById('details').innerHTML=`<div class="card"><div class="greenBar">Football » ${m.league_zone}: ${m.league_name} » Details - ${fullT}</div></div><div class="card"><div class="head">MATCH INFO ID:${id}</div><div class="row"><span>League</span><span>${m.league_name}</span></div><div class="row"><span>Status</span><span style="color:${statusColor};font-weight:900">${statusTxt}</span></div><div class="row"><span>Score</span><span style="color:#00ff66;font-weight:900">${fullT}</span></div><div class="row"><span>1st Half</span><span>${htT}</span></div><div class="row"><span>2nd Half</span><span>${sT}</span></div><div class="row"><span>Home</span><span>${m.home_team} [${homeAbbr}]</span></div><div class="row"><span>Away</span><span>${m.away_team} [${awayAbbr}]</span></div></div><div class="card"><div class="blackHead">1st Half: ${htT}</div>${renderEv(ev1)}</div><div class="card"><div class="blackHead">2nd Half: ${sT} - FT</div>${renderEv(ev2)}</div>`;

 document.getElementById('stats').innerHTML=`<div class="card"><div class="head">STATS - ${fullT}</div><div class="row">No stats</div></div>`;
 document.getElementById('table').innerHTML=`<div class="card"><div class="head">STANDINGS - ${m.league_name}</div><div class="row">Loading...</div></div>`;
 try{
  let r=await fetch(`/api/standings?league_id=${m.league_id}`); if(!r.ok) r=await fetch(`/api/table?league_id=${m.league_id}`);
  let j=await r.json(); let tbl=j.data||[];
  let html=`<div style="background:#fff;color:#000;border-radius:12px;margin:10px"><div style="background:#006400;color:#fff;padding:10px;font-weight:900">${m.league_name}</div><table class="stand-table"><tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>G</th><th>PTS</th></tr>`;
  tbl.forEach(row=>{ html+=`<tr><td>${row.position||''}.</td><td>${row.team?.name||row.name}</td><td>${row.played||0}</td><td>${row.won||0}</td><td>${row.draw||0}</td><td>${row.lost||0}</td><td>${row.goals_for||0}:${row.goals_against||0}</td><td><b>${row.points||0}</b></td></tr>`; });
  html+=`</table></div>`; document.getElementById('table').innerHTML=html;
 }catch(e){ document.getElementById('table').innerHTML=`<div class="card"><div class="row">No standings</div></div>`; }
 document.getElementById('h2h').innerHTML=`<div class="card"><div class="head">H2H - ${m.home_team} vs ${m.away_team}</div><div class="row">No H2H data</div></div>`;
}
load();showTab('details',document.getElementById('b1'));
</script>
</body>
</html>
