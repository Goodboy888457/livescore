<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match LIVE - All Leagues FIXED</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#000;font-weight:900;font-size:18px}
.header a{background:#fff;color:#000;padding:6px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:900}
.scorebox{background:#111;padding:25px 15px;text-align:center;border-bottom:3px solid #00c853}
.league{color:#888;font-size:13px}
.teams{font-size:28px;font-weight:900;margin:12px 0;line-height:34px}
.score{font-size:64px;font-weight:900;color:#00ff66}
.live{color:#ff3b30;font-weight:900;font-size:20px}
.tabs{display:flex;background:#121212;position:sticky;top:0;z-index:10}
.tabs button{flex:1;background:#121212;color:#888;border:0;padding:16px;font-weight:900;font-size:13px}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00c853;background:#1a1a1a}
.content{padding:10px}
.card{background:#1a1a1a;border-radius:14px;margin:10px 0;overflow:hidden;border:1px solid #222}
.head{background:#222;color:#00ff66;padding:10px 14px;font-weight:900;font-size:12px}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:13px;align-items:center}
.greenBar{background:#006400;color:#fff;padding:10px;text-align:center;font-weight:900;font-size:13px}
.blackHead{background:#000;color:#fff;padding:8px 14px;font-weight:900;border-left:3px solid #00c853;font-size:12px}
.stand-table{width:100%;border-collapse:collapse;background:#fff;color:#000}
.stand-table th{background:#006400;color:#fff;padding:8px 4px;font-size:11px;text-align:center}
.stand-table td{padding:8px 4px;font-size:13px;border-bottom:1px solid #eee;text-align:center}
.stand-table td:nth-child(2){text-align:left;font-weight:600}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore</span><a href="/">← Back</a></div>
<div class="scorebox" id="top">Loading...</div>
<div class="tabs">
<button id="b1" class="active" onclick="showTab('details',this)">DETAILS</button>
<button onclick="showTab('stats',this)">STATS</button>
<button onclick="showTab('table',this)">STANDINGS</button>
<button onclick="showTab('h2h',this)">H2H</button>
</div>
<div id="details" class="content"></div>
<div id="stats" class="content" style="display:none"></div>
<div id="table" class="content" style="display:none"></div>
<div id="h2h" class="content" style="display:none"></div>
<script>
function showTab(n,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.content').forEach(c=>c.style.display='none');document.getElementById(n).style.display='block';}
function pick(o,ks){ if(!o) return null; for(let k of ks){ if(o[k]!==undefined&&o[k]!==null&&o[k]!==''&&String(o[k]).toLowerCase()!=='undefined') return o[k]; } return null; }

async function load(){
 let params=new URLSearchParams(location.search);
 let id=params.get('id')||sessionStorage.getItem('mid')||localStorage.getItem('mid');
 if(!id){ document.getElementById('top').innerHTML='<div style="padding:40px"><a href="/">Go Back</a></div>'; return; }
 let m=null;
 try{ let raw=sessionStorage.getItem('selected_match')||localStorage.getItem('selected_match'); if(raw){ let p=JSON.parse(raw); if(String(p.id)===String(id)) m=p; } }catch(e){}

 if(!m || !m.home_team){
  try{
   let r=await fetch(`/api/fixture?id=${id}`);
   if(r.ok){
    let j=await r.json(); let f=j.fixture||j.data||j||{};
    let hh = pick(f, ['ht_home','home_ht','ht_home_score','home_ht_score','halftime_home','ht_h','home_score_ht','score_ht_home','htHome']) ?? pick(f.score?.halftime||{},['home','h']) ?? null;
    let aa = pick(f, ['ht_away','away_ht','ht_away_score','away_ht_score','halftime_away','ht_a','away_score_ht','score_ht_away','htAway']) ?? pick(f.score?.halftime||{},['away','a']) ?? null;
    m={
      id:f.id||id,
      home_team:f.home_team||f.homeTeam?.name||f.teams?.home?.name||'Home',
      away_team:f.away_team||f.awayTeam?.name||f.teams?.away?.name||'Away',
      league_name:f.league_name||f.league?.name||'League',
      league_zone:f.league_zone||f.league?.country||'World',
      home_score: f.home_score ?? f.score?.fulltime?.home ?? f.score?.home ?? null,
      away_score: f.away_score ?? f.score?.fulltime?.away ?? f.score?.away ?? null,
      home_ht: hh, away_ht: aa,
      status:f.status||'FT', minute:f.minute||'', league_id:f.league_id||f.league?.id||'0',
      datetime:f.datetime||f.date||'', kickoff_utc:f.kickoff_utc||''
    };
   }
  }catch(e){}
 }
 if(!m){ m={id,home_team:'Match '+id,away_team:'',league_name:'League',league_zone:'',home_score:null,away_score:null,home_ht:null,away_ht:null,status:'Scheduled',league_id:'0',datetime:''}; }

 // FETCH EVENTS FOR ALL LEAGUES FIRST
 let events=[]; try{ let r=await fetch(`/api/events?id=${id}`); let j=await r.json(); events=j.data||j.events||[]; }catch(e){}

 // FIX FOR ALL LEAGUES: If HT missing, calculate from goal events ≤45'
 let hasHT = (m.home_ht!==null && m.away_ht!==null);
 let calcH=0, calcA=0;
 if(!hasHT && events.length){
   events.forEach(ev=>{
     let min=parseInt(ev.minute||0);
     let type=(ev.event_type||ev.type||'').toLowerCase();
     if(type.includes('goal') && min>0 && min<=45){
       let side=(ev.team_side||ev.team||ev.side||'').toLowerCase();
       if(side.includes('home') || side==='h') calcH++; else if(side.includes('away') || side==='a') calcA++;
       else {
         // If no side, count by comparing teams - fallback
         if(ev.team===m.home_team) calcH++; else calcA++;
       }
     }
   });
   // If still 0-0 and no goal events, count from API goals if available? For 15914717 it stays 0-0 which is correct
 }

 let hHT = hasHT ? parseInt(m.home_ht) : calcH;
 let aHT = hasHT ? parseInt(m.away_ht) : calcA;
 let isScheduled = (m.status==='Scheduled'||m.status==='NS'||m.home_score===null);
 let hS = isScheduled?0:parseInt(m.home_score??0), aS = isScheduled?0:parseInt(m.away_score??0);
 let htT = isScheduled ? '-' : `${hHT}-${aHT}`;
 let sT = isScheduled ? '-' : `${hS-hHT}-${aS-aHT}`; // 2nd half only (like Flashscore 2-1)
 let ftT = isScheduled ? 'VS' : `${hS} - ${aS}`;
 let fullT = isScheduled ? 'VS' : `${hS}-${aS} (${htT},${sT})`;

 let scoreDisplay = isScheduled ? 'VS' : `${hS} - ${aS}`;
 let statusTxt = isScheduled ? 'Scheduled' : `Finished - FT - ${fullT}`;
 let statusColor = isScheduled ? '#888' : '#00ff66';
 if(m.status==='LIVE'){ statusTxt=`Live ${m.minute} - ${fullT}`; statusColor='#ff3b30'; }
 if(m.status==='HT'){ statusTxt=`Half Time - HT - ${htT}`; statusColor='#ff9500'; }

 document.getElementById('top').innerHTML=`<div class="league">${m.league_zone} - ${m.league_name}</div><div class="teams">${m.home_team}<br><span style="color:#555">VS</span><br>${m.away_team}</div><div class="score">${scoreDisplay}</div><div class="live" style="color:${statusColor}">${statusTxt}</div><div style="color:#666;font-size:11px">${m.datetime} | ID:${id}</div>`;

 function icon(t){ t=(t||'').toLowerCase(); if(t.includes('yellow')) return '🟨'; if(t.includes('red')) return '🟥'; if(t.includes('goal')) return '⚽'; if(t.includes('substitut')) return '🔄'; return '•'; }
 function renderEv(list){
   if(!list.length) return `<div class="row" style="color:#666">No events - ${statusTxt}</div>`;
   return list.map(e=>{
     let type=e.event_type||e.type||'';
     let min=e.minute||'';
     let player=e.player_name||e.player||'';
     let rel=e.related_player||e.player_out||'';
     let team=(e.team_side||e.team||'').toUpperCase().substring(0,3);
     let txt = type.toLowerCase().includes('substitut') ? `${player}${rel?` (${rel})`:''} [${team}]` : `${player} ${type.replace('_',' ')} [${team}]`;
     return `<div class="row"><span>${min}' ${icon(type)} ${txt}</span><span style="color:#888">${team}</span></div>`;
   }).join('');
 }
 let ev1=events.filter(e=>parseInt(e.minute||0)<=45), ev2=events.filter(e=>parseInt(e.minute||0)>45);
 document.getElementById('details').innerHTML=`<div class="card"><div class="greenBar">Football » ${m.league_zone}: ${m.league_name} » Details - ${fullT}</div></div><div class="card"><div class="head">MATCH INFO ID:${id}</div><div class="row"><span>League</span><span>${m.league_name}</span></div><div class="row"><span>Status</span><span style="color:${statusColor};font-weight:900">${statusTxt}</span></div><div class="row"><span>Score</span><span style="color:#00ff66;font-weight:900">${fullT}</span></div><div class="row"><span>1st Half</span><span>${htT}</span></div><div class="row"><span>2nd Half</span><span>${sT}</span></div></div><div class="card"><div class="blackHead">1st Half: ${htT}</div>${renderEv(ev1)}</div><div class="card"><div class="blackHead">2nd Half: ${sT} - ${m.status}</div>${renderEv(ev2)}</div>`;

 document.getElementById('stats').innerHTML=`<div class="card"><div class="head">Loading STATS...</div></div>`;
 try{
  let r=await fetch(`/api/stats?id=${id}`); let j=await r.json(); let d=j.data||j;
  let html=`<div class="card"><div class="greenBar">STATS - ${fullT}</div>`;
  if(d && d.home){ let mk=(l,h,a)=>`<div class="row"><span style="font-weight:900">${h}</span><span style="color:#888;flex:1;text-align:center">${l}</span><span style="font-weight:900">${a}</span></div>`; html+=mk('Shots',d.home.shots||0,d.away.shots||0)+mk('Corners',d.home.corners||0,d.away.corners||0); }
  else html+=`<div style="padding:20px;text-align:center;color:#666">No stats</div>`; html+=`</div>`; document.getElementById('stats').innerHTML=html;
 }catch(e){ document.getElementById('stats').innerHTML=`<div class="card"><div class="row">No stats</div></div>`; }

 document.getElementById('table').innerHTML=`<div class="card"><div class="head">Loading STANDINGS...</div></div>`;
 try{
  let r=await fetch(`/api/standings?league_id=${m.league_id}`); if(!r.ok) r=await fetch(`/api/table?league_id=${m.league_id}`);
  let j=await r.json(); let tbl=j.data||[];
  let html=`<div style="background:#fff;color:#000;border-radius:12px;overflow:hidden;margin:10px"><div style="background:#006400;color:#fff;padding:10px;font-weight:900">${m.league_name} - Standings</div><table class="stand-table"><tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>G</th><th>PTS</th></tr>`;
  tbl.forEach(row=>{ html+=`<tr><td>${row.position||''}.</td><td>${row.team?.name||row.name}</td><td>${row.played||0}</td><td>${row.won||0}</td><td>${row.draw||0}</td><td>${row.lost||0}</td><td>${row.goals_for||0}:${row.goals_against||0}</td><td><b>${row.points||0}</b></td></tr>`; });
  html+=`</table></div>`; document.getElementById('table').innerHTML=html;
 }catch(e){ document.getElementById('table').innerHTML=`<div class="card"><div class="row">No standings</div></div>`; }

 document.getElementById('h2h').innerHTML=`<div class="card"><div class="head">Loading H2H...</div></div>`;
 try{ let r=await fetch(`/api/h2h?id=${id}`); let j=await r.json(); let h2h=j.data||[]; let html=`<div class="card"><div class="greenBar">H2H - ${m.home_team} vs ${m.away_team}</div>`; if(h2h.length){ h2h.forEach(g=>{ html+=`<div class="row"><span>${g.date||''} ${g.home_team} ${g.home_score}-${g.away_score} ${g.away_team}</span></div>`; }); } else html+=`<div class="row">No H2H</div>`; html+=`</div>`; document.getElementById('h2h').innerHTML=html; }catch(e){}
}
load();showTab('details',document.getElementById('b1'));
</script>
</body>
</html>
