<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match - GREEN + POSSESSION</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;display:flex;justify-content:space-between;color:#000;font-weight:900}
.header a{background:#fff;color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700}
.scorebox{background:#151515;padding:30px 20px;text-align:center;border-bottom:3px solid #00ff66}
.teams{font-size:26px;font-weight:900;margin:15px 0}
.score{font-size:56px;color:#00ff66;font-weight:900}
.vs{color:#555}
.time-big{color:#00ff66;font-size:22px;font-weight:900}
.tabs{display:flex;background:#121212;position:sticky;top:0;z-index:10}
.tabs button{flex:1;background:#121212;color:#aaa;border:0;padding:16px;font-weight:900}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00ff66}
.content{padding:12px}
.card{background:#151515;border-radius:14px;padding:14px;margin:10px 0;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #222;font-size:14px}
.row.head{color:#00ff66;font-weight:900;background:#1f1f1f;border-radius:10px;text-transform:uppercase;font-size:11px}
.blackHead{background:#00c853;color:#000;padding:8px 14px;font-weight:900;font-size:12px}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore</span><a href="/">← Back</a></div>
<div id="top" class="scorebox">Loading...</div>
<div class="tabs">
<button id="b1" class="active" onclick="tab('details',this)">DETAILS</button>
<button onclick="tab('stats',this)">STATS</button>
<button onclick="tab('table',this)">TABLE</button>
<button onclick="tab('h2h',this)">H2H</button>
</div>
<div id="details" class="content"></div>
<div id="stats" class="content" style="display:none"></div>
<div id="table" class="content" style="display:none"></div>
<div id="h2h" class="content" style="display:none"></div>
<script>
function tab(n,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.content').forEach(c=>c.style.display='none');document.getElementById(n).style.display='block';}
async function load(){
let raw=localStorage.getItem('selected_match');
if(!raw){document.getElementById('top').innerHTML="No match";return}
let m=JSON.parse(raw);
let id=m.id,home=m.home_team,away=m.away_team,league=m.league_name,zone=m.league_zone||"",hS=m.home_score,aS=m.away_score,st=m.status,mi=m.minute||"",dt=m.datetime||"",lid=m.league_id,hid=m.home_id,aid=m.away_id;
let tOnly=(dt.split(' ')[1]||'').slice(0,5),dOnly=dt.split(' ')[0]||'';
let sHTML=hS==null?`<div class="vs">VS</div><div class="time-big">🕘 ${tOnly}</div><div>${dOnly}</div><div style="color:#00ff66;margin-top:10px;font-weight:900">${st}</div>`:`<div class="score">${hS} - ${aS}</div><div style="color:${st=='LIVE'?'#ff3b30':'#aaa'};font-weight:900">${st} ${mi}</div><div style="color:#666;font-size:11px">${dt}</div>`;
document.getElementById('top').innerHTML=`<div style="color:#888;font-size:12px">${zone} - ${league}</div><div class="teams">${home}<br><span class="vs">vs</span><br>${away}</div>${sHTML}`;
document.getElementById('details').innerHTML=`<div class="card"><div class="row head"><span>MATCH INFO</span></div><div class="row"><span>League</span><span>${league}</span></div><div class="row"><span>Kick-off</span><span>${dt}</span></div></div><div class="card"><div class="row head"><span>EVENTS</span></div><div id="ev">Loading...</div></div>`;
try{let r=await fetch(`/api/events?id=${id}`);let j=await r.json();let ev=j.data||[];document.getElementById('ev').innerHTML=ev.length?ev.map(e=>`<div class="row"><span>⏱ ${e.minute}' ${e.event_type} ${e.player_name||''}</span><span>${e.team_side||''}</span></div>`).join(''):`<div style="padding:15px;color:#666;text-align:center">No events</div>`;}catch(e){}

// STATS WITH BALL POSSESSION - ADDED HERE!
document.getElementById('stats').innerHTML=`<div class="card"><div class="row head"><span>LOADING STATS...</span></div></div>`;
try{
let r=await fetch(`/api/stats?id=${id}`);
let j=await r.json();
let d=j.data;
let found=false;
let html=`<div style="background:#00c853;color:#000;padding:8px;text-align:center;font-weight:900;border-radius:10px 10px 0 0">Top stats - GREEN</div>`;
if(d && d.home && d.away){
  found=true;
  // BALL POSSESSION CALC - HERE!
  let homePass=d.home.total_passes||0, awayPass=d.away.total_passes||0, total=homePass+awayPass||1;
  let homePoss=Math.round(homePass/total*100), awayPoss=100-homePoss;
  let mk=(label,hv,av)=>{
    let h=parseFloat(hv)||0,a=parseFloat(av)||0,t=h+a||1,hp=Math.round(h/t*100),ap=100-hp;
    return `<div style="background:#151515;padding:12px;border-bottom:1px solid #222"><div style="display:flex;justify-content:space-between;font-size:14px"><span style="font-weight:900;color:#fff">${hv}</span><span style="color:#888;font-size:11px;font-weight:900;flex:1;text-align:center;margin:0 10px">${label}</span><span style="font-weight:900;color:#fff">${av}</span></div><div style="display:flex;height:6px;background:#222;margin-top:8px;border-radius:10px;overflow:hidden"><div style="width:${hp}%;background:#00c853"></div><div style="width:${ap}%;background:#00ff66"></div></div></div>`;
  };
  html+=mk('Ball Possession',homePoss+'%',awayPoss+'%');
  html+=mk('Shots',d.home.shots,d.away.shots);
  html+=mk('On Target',d.home.shots_on_target,d.away.shots_on_target);
  html+=mk('Off Target',d.home.shots_off_target,d.away.shots_off_target);
  html+=mk('Fouls',d.home.fouls,d.away.fouls);
  html+=mk('Passes',d.home.total_passes,d.away.total_passes);
  html+=mk('Pass Acc %',d.home.pass_accuracy+'%',d.away.pass_accuracy+'%');
  html+=mk('Tackles',d.home.tackles,d.away.tackles);
  html+=mk('Saves',d.home.saves,d.away.saves);
  html+=mk('Yellow Cards',d.home.yellow_cards,d.away.yellow_cards);
  document.getElementById('stats').innerHTML=`<div style="border-radius:10px;overflow:hidden">${html}</div>`;
}
if(!found){
  document.getElementById('stats').innerHTML=`<div class="card"><div style="padding:25px;text-align:center"><div style="font-size:40px">📊</div><div style="font-weight:900">No stats available</div><div style="color:#888;font-size:12px">ID:${id}<br>${league}</div></div></div>`;
}
}catch(e){document.getElementById('stats').innerHTML=`<div class="card">Error:${e.message}</div>`;}

// TABLE
document.getElementById('table').innerHTML=`<div class="card"><div class="row head"><span>TABLE Loading...</span></div></div>`;
try{
let r=await fetch(`/api/standings?id=${lid}`);
let j=await r.json();
let list=j.data||[];let leagueName=j.league?.name||league;
if(list.length===0){document.getElementById('table').innerHTML=`<div class="card"><div style="padding:20px;text-align:center">Table unavailable<br>${leagueName}</div></div>`;}
else{
let html=`<div class="card" style="padding:0"><div style="background:#00c853;color:#000;padding:10px 14px;font-weight:900">⚽ ${leagueName} - ${list.length} teams</div><div class="row head" style="border-radius:0"><span style="width:30px">#</span><span style="flex:1">Team</span><span style="width:28px;text-align:center">MP</span><span style="width:22px;text-align:center">W</span><span style="width:22px;text-align:center">D</span><span style="width:22px;text-align:center">L</span><span style="width:40px;text-align:center">G</span><span style="width:32px;text-align:center">PTS</span></div>`;
list.forEach(t=>{
let isMe= (t.team?.name||'').toLowerCase()===home.toLowerCase() || (t.team?.name||'').toLowerCase()===away.toLowerCase();
html+=`<div class="row" style="${isMe?'background:#1a2e1a;border-left:3px solid #00ff66':''}"><span style="width:30px;color:#888">${t.position}.</span><span style="flex:1;font-weight:${isMe?'900':'600'};color:${isMe?'#00ff66':'#fff'}">${t.team?.name||''}</span><span style="width:28px;text-align:center">${t.played}</span><span style="width:22px;text-align:center">${t.won}</span><span style="width:22px;text-align:center">${t.draw}</span><span style="width:22px;text-align:center">${t.lost}</span><span style="width:40px;text-align:center;color:#aaa;font-size:11px">${t.goals_for}:${t.goals_against}</span><span style="width:32px;text-align:center;color:#00ff66;font-weight:900">${t.points}</span></div>`;
});
html+='</div>';document.getElementById('table').innerHTML=html;
}
}catch(e){}

document.getElementById('
