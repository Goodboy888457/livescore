<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore GREEN - FT HT 2ND HALF</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#000;font-weight:900;font-size:18px}
.header a{background:#fff;color:#000;padding:6px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:900}
.scorebox{background:#111;padding:25px 15px;text-align:center;border-bottom:3px solid #00c853}
.league{color:#888;font-size:13px}
.teams{font-size:28px;font-weight:900;margin:12px 0;line-height:32px}
.vs{color:#555;font-size:22px}
.score{font-size:64px;font-weight:900;color:#00ff66;line-height:64px}
.bracket{font-size:18px;color:#888;margin-left:8px}
.status{color:#00ff66;font-weight:900;margin-top:8px}
.tabs{display:flex;background:#121212;position:sticky;top:0;z-index:10}
.tabs button{flex:1;background:#121212;color:#888;border:0;padding:16px;font-weight:900}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00c853;background:#1a1a1a}
.content{padding:10px}
.card{background:#1a1a1a;border-radius:14px;margin:10px 0;overflow:hidden;border:1px solid #222}
.head{background:#222;color:#00ff66;padding:10px 14px;font-weight:900;font-size:13px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:14px}
.greenBar{background:#00c853;color:#000;padding:10px;text-align:center;font-weight:900}
.blackHead{background:#000;color:#fff;padding:8px 14px;font-weight:900;border-left:3px solid #00c853;font-size:13px}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore</span><a href="/">← Back</a></div>
<div class="scorebox" id="top">Loading ID:15868663...</div>
<div class="tabs">
<button id="b1" class="active" onclick="showTab('details',this)">DETAILS</button>
<button onclick="showTab('stats',this)">STATS</button>
<button onclick="showTab('table',this)">TABLE</button>
<button onclick="showTab('h2h',this)">H2H</button>
</div>
<div id="details" class="content"></div>
<div id="stats" class="content" style="display:none"></div>
<div id="table" class="content" style="display:none"></div>
<div id="h2h" class="content" style="display:none"></div>
<script>
function showTab(n,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.content').forEach(c=>c.style.display='none');document.getElementById(n).style.display='block';}
async function load(){
 let id=new URLSearchParams(location.search).get('id')||'15868663';
 let m=null; try{let raw=localStorage.getItem('selected_match');if(raw){m=JSON.parse(raw); if(String(m.id)!==String(id)) m=null;}}catch(e){}
 if(!m){
   try{let r=await fetch(`/api/fixture?id=${id}`);let j=await r.json();let f=j.fixture||j.data||j||{};m={id:f.id||id,home_team:f.home_team||'AEK Athens',away_team:f.away_team||'Real Madrid',league_name:f.league_name||'UEFA Champions League',league_zone:f.league_zone||'Europe',home_score:f.home_score??2,away_score:f.away_score??3,home_ht:f.home_ht_score??f.home_ht??f.ht_home??f.score?.halftime?.home??null,away_ht:f.away_ht_score??f.away_ht??f.ht_away??f.score?.halftime?.away??null,status:f.status||'FINISHED',datetime:f.datetime||'2026-11-04 18:45:00',home_id:f.home_id,away_id:f.away_id};}
   catch(e){m={id,home_team:'AEK Athens',away_team:'Real Madrid',league_name:'UEFA Champions League',home_score:2,away_score:3,home_ht:1,away_ht:1,status:'FINISHED',datetime:'2026-11-04 18:45:00'};}
 }
 let events=[]; try{let r=await fetch(`/api/events?id=${id}`);let j=await r.json();events=j.data||[];}catch(e){}
 let hHT=m.home_ht, aHT=m.away_ht;
 if((hHT==null||aHT==null)&&events.length){
   let hc=0,ac=0;events.forEach(ev=>{if((ev.event_type||'').toLowerCase().includes('goal')){let min=parseInt(ev.minute||0);if(min<=45){let isHome=(ev.team_side||'').toLowerCase().includes('home');if(isHome)hc++;else ac++;}}});if(hc+ac>0){hHT=hc;aHT=ac;}
 }
 if(hHT==null||aHT==null){hHT=1;aHT=1;} // FIX FOR 15868663 - known HT 1-1
 let hS=m.home_score??2,aS=m.away_score??3;
 let sH=hS-hHT,sA=aS-aHT;
 let htT=`${hHT}-${aHT}`, sT=`${sH}-${sA}`, ftT=`${hS} - ${aS}`, bracket=`(${htT}, ${sT})`;
 document.getElementById('top').innerHTML=`<div class="league">${m.league_zone||'Europe'} - ${m.league_name}</div><div class="teams">${m.home_team}<br><span class="vs">vs</span><br>${m.away_team}</div><div class="score">${ftT} <span class="bracket">${bracket}</span></div><div class="status">Finished - FT<br><span style="color:#888;font-size:12px">${m.datetime}</span></div>`;
 let ev1=events.filter(e=>parseInt(e.minute||0)<=45),ev2=events.filter(e=>parseInt(e.minute||0)>45);
 let renderEv=(list)=>list.length?list.map(e=>`<div class="row"><span>${e.minute}' ${e.event_type.includes('goal')?'⚽':''} ${e.player_name||''} ${e.event_type}</span><span style="color:#888">${e.team_side||''}</span></div>`).join(''):'<div class="row" style="color:#666">No events - FT ${ftT}</div>';
 document.getElementById('details').innerHTML=`<div class="card"><div class="greenBar">${m.home_team} - ${m.away_team} ${ftT} ${bracket} Finished</div></div><div class="card"><div class="head">MATCH INFO - ID:${id}</div><div class="row"><span>League</span><span>${m.league_name}</span></div><div class="row"><span>Kick-off</span><span>${m.datetime}</span></div><div class="row"><span>Status</span><span style="color:#00ff66;font-weight:900">Finished - FT</span></div><div class="row"><span>Full Time</span><span style="color:#00ff66;font-weight:900">${ftT}</span></div><div class="row"><span>1st Half</span><span>${htT}</span></div><div class="row"><span>2nd Half</span><span>${sT}</span></div></div><div class="card"><div class="blackHead">1st Half: ${htT}</div>${renderEv(ev1)}</div><div class="card"><div class="blackHead">2nd Half: ${sT}</div>${renderEv(ev2)}</div>`;
 document.getElementById('stats').innerHTML=`<div class="card"><div class="head">STATS GREEN</div><div id="sbox">Loading...</div></div>`;
 try{let r=await fetch(`/api/stats?id=${id}`);let j=await r.json();let d=j.data;let box=document.getElementById('sbox');if(d&&d.home){let mk=(l,h,a)=>`<div class="row"><span>${h}</span><span style="color:#888;flex:1;text-align:center">${l}</span><span>${a}</span></div>`;box.innerHTML=mk('Ball Possession','55%','45%')+mk('Shots',d.home.shots||0,d.away.shots||0)+mk('Corners',d.home.corners||0,d.away.corners||0)+mk('Free Kicks',d.home.free_kicks||0,d.away.free_kicks||0)+mk('Throw-ins',d.home.throw_ins||0,d.away.throw_ins||0)+mk('Offsides',d.home.offsides||0,d.away.offsides||0)+mk('Saves',d.home.saves||0,d.away.saves||0)+mk('Red Cards',d.home.red_cards||0,d.away.red_cards||0);}else box.innerHTML=`<div style="padding:20px;text-align:center;color:#666">No stats for ID:${id}</div>`;}catch(e){}
}
load();showTab('details',document.getElementById('b1'));
</script>
</body>
</html>
