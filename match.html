<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match - DETAILS STATS TABLE H2H</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#000;font-weight:900;font-size:18px}
.header a{background:#fff;color:#000;padding:6px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:900}
.scorebox{background:#111;padding:25px 15px;text-align:center;border-bottom:3px solid #00c853}
.league{color:#888;font-size:13px}
.teams{font-size:26px;font-weight:900;margin:12px 0}
.score{font-size:60px;font-weight:900;color:#00ff66}
.status{color:#00ff66;font-weight:900;margin-top:8px}
.tabs{display:flex;background:#121212;position:sticky;top:0;z-index:10}
.tabs button{flex:1;background:#121212;color:#888;border:0;padding:14px;font-weight:900;font-size:12px}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00c853;background:#1a1a1a}
.content{padding:10px}
.card{background:#1a1a1a;border-radius:12px;margin:10px 0;overflow:hidden;border:1px solid #222}
.head{background:#222;color:#00ff66;padding:10px 14px;font-weight:900;font-size:12px}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:13px}
.greenBar{background:#00c853;color:#000;padding:10px;text-align:center;font-weight:900}
.blackHead{background:#000;color:#fff;padding:8px 14px;font-weight:900;border-left:3px solid #00c853;font-size:12px}
.table-head{display:flex;justify-content:space-between;padding:8px 12px;background:#222;font-weight:900;font-size:11px;color:#888}
.table-row{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #222;font-size:13px}
.table-row.hl{background:rgba(0,200,83,0.18);border-left:3px solid #00c853;font-weight:900}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore</span><a href="/livescore/">← Back</a></div>
<div class="scorebox" id="top">Loading...</div>
<div class="tabs">
<button id="b1" class="active" onclick="showTab('details',this)">DETAILS</button>
<button onclick="showTab('stats',this)">STATS</button>
<button onclick="showTab('table',this)">TABLE</button>
<button onclick="showTab('h2h',this)">H2H</button>
</div>
<div id="details" class="content"></div>
<div id="stats" class="content" style="display:none"></div>
<div id="table" class="content" style="display:none"></div>
<div id="h2h" class="content" style="display:none"></div>
<script>
function showTab(n,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.content').forEach(c=>c.style.display='none');document.getElementById(n).style.display='block';}
async function load(){
 let id=new URLSearchParams(location.search).get('id')||'15868663';
 let m=null;try{let r=localStorage.getItem('selected_match');if(r){m=JSON.parse(r); if(String(m.id)!==String(id)) m=null;}}catch(e){}
 if(!m){try{let r=await fetch(`/api/fixture?id=${id}`);let j=await r.json();let f=j.fixture||j.data||j||{};m={id:f.id||id,home_team:f.home_team||'AEK Athens',away_team:f.away_team||'Real Madrid',league_name:f.league_name||'UEFA Champions League',league_zone:f.league_zone||'Europe',home_score:f.home_score??2,away_score:f.away_score??3,home_ht:f.home_ht_score??1,away_ht:f.away_ht_score??1,league_id:f.league_id||'400',datetime:f.datetime||'2026-11-04 18:45'};}catch(e){m={id,home_team:'AEK Athens',away_team:'Real Madrid',league_name:'UEFA Champions League',league_zone:'Europe',home_score:2,away_score:3,home_ht:1,away_ht:1,league_id:'400',datetime:'2026-11-04 18:45'};}}
 let hHT=m.home_ht??1,aHT=m.away_ht??1,hS=m.home_score??2,aS=m.away_score??3,sH=hS-hHT,sA=aS-aHT,htT=`${hHT}-${aHT}`,sT=`${sH}-${sA}`,ftT=`${hS} - ${aS}`,bracket=`(${htT}, ${sT})`;
 document.getElementById('top').innerHTML=`<div class="league">${m.league_zone} - ${m.league_name}</div><div class="teams">${m.home_team}<br>vs<br>${m.away_team}</div><div class="score">${ftT}<br><span style="font-size:18px;color:#888">${bracket}</span></div><div class="status">Finished - FT<br><span style="color:#888;font-size:11px">${m.datetime}</span></div>`;
 let events=[];try{let r=await fetch(`/api/events?id=${id}`);let j=await r.json();events=j.data||[];}catch(e){}
 let ev1=events.filter(e=>parseInt(e.minute||0)<=45),ev2=events.filter(e=>parseInt(e.minute||0)>45);
 let renderEv=(l)=>l.length?l.map(e=>`<div class="row"><span>${e.minute}' ⚽ ${e.player_name||''} - ${e.event_type||''}</span><span style="color:#888">${e.team_side||''}</span></div>`).join(''):`<div class="row" style="color:#666">No events</div>`;
 document.getElementById('details').innerHTML=`<div class="card"><div class="greenBar">${m.home_team} ${ftT} ${m.away_team} FT</div></div><div class="card"><div class="head">MATCH INFO ID:${id}</div><div class="row"><span>League</span><span>${m.league_name}</span></div><div class="row"><span>Full Time</span><span style="color:#00ff66;font-weight:900">${ftT}</span></div><div class="row"><span>1st Half</span><span>${htT}</span></div><div class="row"><span>2nd Half</span><span>${sT}</span></div></div><div class="card"><div class="blackHead">1st Half: ${htT}</div>${renderEv(ev1)}</div><div class="card"><div class="blackHead">2nd Half: ${sT}</div>${renderEv(ev2)}</div>`;
 document.getElementById('stats').innerHTML=`<div class="card"><div class="head">Loading STATS...</div></div>`;
 try{let r=await fetch(`/api/stats?id=${id}`);let j=await r.json();let d=j.data||j;let html=`<div class="card"><div class="greenBar">STATS ${ftT} ${bracket}</div>`;if(d&&d.home){let mk=(l,h,a)=>`<div class="row"><span style="font-weight:900">${h}</span><span style="color:#888;flex:1;text-align:center">${l}</span><span style="font-weight:900">${a}</span></div>`;html+=mk('Shots',d.home.shots||0,d.away.shots||0)+mk('Corners',d.home.corners||0,d.away.corners||0)+mk('Fouls',d.home.fouls||0,d.away.fouls||0)+mk('Yellow',d.home.yellow_cards||0,d.away.yellow_cards||0)+mk('Possession',d.home.possession||'55%',d.away.possession||'45%');}else html+=`<div class="row" style="color:#666">No stats</div>`;html+=`</div>`;document.getElementById('stats').innerHTML=html;}catch(e){}
 document.getElementById('table').innerHTML=`<div class="card"><div class="head">Loading TABLE...</div></div>`;
 try{let r=await fetch(`/api/table?league_id=${m.league_id}&id=${id}`);let j=await r.json();let tbl=j.data||j.table||[];let html=`<div class="card"><div class="greenBar">TABLE - ${m.league_name}</div><div class="table-head"><span># TEAM</span><span>PTS</span></div>`;if(tbl.length){tbl.forEach((t,i)=>{let name=t.team_name||t.name||'Team';let pts=t.points||0;let isOur=name.toLowerCase().includes(m.home_team.split(' ')[0].toLowerCase())||name.toLowerCase().includes(m.away_team.split(' ')[0].toLowerCase());html+=`<div class="table-row ${isOur?'hl':''}"><span>${i+1}. ${name}</span><span>${pts}</span></div>`;});}else html+=`<div class="row">Table loading... Connect /api/table</div>`;html+=`</div>`;document.getElementById('table').innerHTML=html;}catch(e){}
 document.getElementById('h2h').innerHTML=`<div class="card"><div class="head">Loading H2H...</div></div>`;
 try{let r=await fetch(`/api/h2h?id=${id}`);let j=await r.json();let h2h=j.data||[];let html=`<div class="card"><div class="greenBar">H2H ${m.home_team} vs ${m.away_team}</div>`;if(h2h.length){h2h.forEach(g=>{html+=`<div class="row"><span>${g.date||''} ${g.home_team} vs ${g.away_team}</span><span style="color:#00ff66">${g.home_score}-${g.away_score}</span></div>`;});}else html+=`<div class="row" style="color:#666">H2H will appear when /api/h2h ready</div>`;html+=`</div>`;document.getElementById('h2h').innerHTML=html;}catch(e){}
}
load();showTab('details',document.getElementById('b1'));
</script>
</body>
</html>
