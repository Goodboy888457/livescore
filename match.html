<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match LIVE - Highlightly ONLY</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#000;font-weight:900;font-size:18px}
.header a{background:#fff;color:#000;padding:6px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:900}
.scorebox{background:#111;padding:25px 15px;text-align:center;border-bottom:3px solid #00c853}
.league{color:#888;font-size:13px}
.teams{font-size:26px;font-weight:900;margin:12px 0;line-height:32px}
.score{font-size:64px;font-weight:900;color:#00ff66}
.live{font-weight:900;font-size:20px}
.tabs{display:flex;background:#121212;position:sticky;top:0;z-index:10}
.tabs button{flex:1;background:#121212;color:#888;border:0;padding:16px;font-weight:900;font-size:13px}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00c853;background:#1a1a1a}
.content{padding:10px}
.card{background:#1a1a1a;border-radius:14px;margin:10px 0;overflow:hidden;border:1px solid #222}
.head{background:#222;color:#00ff66;padding:10px 14px;font-weight:900;font-size:12px}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:13px;align-items:center}
.greenBar{background:#006400;color:#fff;padding:10px;text-align:center;font-weight:900;font-size:13px}
.blackHead{background:#000;color:#fff;padding:8px 14px;font-weight:900;border-left:3px solid #00c853;font-size:12px}
.stand-table{width:100%;border-collapse:collapse;background:#fff;color:#000}
.stand-table th{background:#006400;color:#fff;padding:8px 4px;font-size:11px;text-align:center}
.stand-table td{padding:8px 4px;font-size:13px;border-bottom:1px solid #eee;text-align:center}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore Highlightly</span><a href="/">← Back</a></div>
<div class="scorebox" id="top">Loading Highlightly...</div>
<div class="tabs">
<button id="b1" class="active" onclick="showTab('details',this)">DETAILS</button>
<button onclick="showTab('stats',this)">STATS</button>
<button onclick="showTab('table',this)">STANDINGS</button>
<button onclick="showTab('h2h',this)">H2H</button>
</div>
<div id="details" class="content"></div>
<div id="stats" class="content" style="display:none"></div>
<div id="table" class="content" style="display:none"></div>
<div id="h2h" class="content" style="display:none"></div>
<script>
function showTab(n,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.content').forEach(c=>c.style.display='none');document.getElementById(n).style.display='block';}
function toNum(v){let n=Number(v);return isNaN(n)?0:n;}

async function load(){
 let params=new URLSearchParams(location.search);
 let id=params.get('id')||localStorage.getItem('mid');
 let date=params.get('date')||localStorage.getItem('lastDate')||new Date().toISOString().split('T')[0];
 let m=null;
 try{
  let raw=localStorage.getItem('selected_match');
  if(raw){let p=JSON.parse(raw); if(String(p.id)===String(id)) m=p;}
 }catch(e){}

 // If no stored, fetch from Highlightly backend
 if(!m){
  try{
   let r=await fetch(`/api/fixture?id=${id}`);
   let j=await r.json();
   let f=j.fixture||j.data||j||{};
   m={
    id:f.id||id,
    home_team:f.home_team?.name||f.home_team||f.teams?.home?.name||'Home',
    away_team:f.away_team?.name||f.away_team||f.teams?.away?.name||'Away',
    league_name:f.league?.name||f.league_name||'League',
    league_zone:f.country?.name||f.league?.country||f.country||'World',
    home_score:f.home_score??f.goals?.home??f.score?.home??null,
    away_score:f.away_score??f.goals?.away??f.score?.away??null,
    home_ht:f.score?.halftime?.home??null,
    away_ht:f.score?.halftime?.away??null,
    status:(f.status?.short||f.status||'FT').toUpperCase(),
    minute:f.status?.elapsed||'',
    league_id:f.league?.id||'0',
    datetime:f.kickoff||f.fixture?.date||f.date||date
   };
  }catch(e){}
 }
 if(!m) m={id,home_team:'Home',away_team:'Away',league_name:'League',league_zone:'World',home_score:null,away_score:null,home_ht:null,away_ht:null,status:'NS',league_id:'0',datetime:date};

 let homeAbbr=m.home_team.substring(0,3).toUpperCase();
 let awayAbbr=m.away_team.substring(0,3).toUpperCase();

 // EVENTS from Highlightly
 let events=[];
 try{
  let r=await fetch(`/api/events?id=${id}`);
  let j=await r.json();
  events=j.data||[];
 }catch(e){}

 let isScheduled=(m.status==='NS'||m.status==='SCHEDULED'||(m.home_score===null&&m.away_score===null));
 let hS=isScheduled?0:toNum(m.home_score), aS=isScheduled?0:toNum(m.away_score);
 let hHT=toNum(m.home_ht), aHT=toNum(m.away_ht);
 if(!hHT&&!aHT&&events.length){
  events.forEach(ev=>{let min=parseInt(ev.minute||0); if(ev.event_type?.toLowerCase().includes('goal')&&min<=45){ if((ev.team_side||'').toLowerCase().includes('home')) hHT++; else aHT++; }});
 }
 let htT=isScheduled?'-':`${hHT}-${aHT}`;
 let fullT=isScheduled?'VS':`${hS}-${aS} (${htT})`;
 let scoreDisplay=isScheduled?'VS':`${hS} - ${aS}`;
 let statusTxt=isScheduled?'Scheduled':`${m.status} - ${fullT}`;
 let statusColor=isScheduled?'#888':m.status==='LIVE'?'#ff3b30':'#00ff66';
 if(m.status==='LIVE') statusTxt=`Live ${m.minute||''} - ${fullT}`;

 document.getElementById('top').innerHTML=`<div class="league">${m.league_zone} - ${m.league_name}</div><div class="teams">${m.home_team}<br><span style="color:#555">VS</span><br>${m.away_team}</div><div class="score">${scoreDisplay}</div><div class="live" style="color:${statusColor}">${statusTxt}</div><div style="color:#666;font-size:11px">${m.datetime} | ID:${id} | Highlightly</div>`;

 function icon(t){t=(t||'').toLowerCase(); if(t.includes('yellow')) return '🟨'; if(t.includes('red')) return '🟥'; if(t.includes('goal')) return '⚽'; if(t.includes('sub')) return '🔄'; return '•';}
 function renderEv(list){
  if(!list.length) return `<div class="row" style="color:#666">No events - ${statusTxt}</div>`;
  return list.map(e=>{
   let type=e.event_type||'';
   let min=(e.minute||'').toString().replace("'","");
   let player=e.player||e.player_in||'';
   let out=e.player_out||e.related||'';
   let side=(e.team_side||'').toLowerCase();
   let isHome=side.includes('home')||side.includes(m.home_team.toLowerCase().substring(0,4));
   let abbr=isHome?homeAbbr:awayAbbr;
   let txt=type.toLowerCase().includes('sub')&&out?`${player} (${out}) [${abbr}]`:`${player} ${type} [${abbr}]`;
   return `<div class="row"><span>${min}' ${icon(type)} ${txt}</span><span style="font-weight:900;color:#00c853">${abbr}</span></div>`;
  }).join('');
 }
 let ev1=events.filter(e=>parseInt(e.minute||0)<=45), ev2=events.filter(e=>parseInt(e.minute||0)>45);
 document.getElementById('details').innerHTML=`<div class="card"><div class="greenBar">Highlightly » ${m.league_zone}: ${m.league_name} » ${fullT}</div></div><div class="card"><div class="head">MATCH INFO - Highlightly ID:${id}</div><div class="row"><span>League</span><span>${m.league_name}</span></div><div class="row"><span>Status</span><span style="color:${statusColor};font-weight:900">${statusTxt}</span></div><div class="row"><span>Score</span><span style="color:#00ff66;font-weight:900">${fullT}</span></div><div class="row"><span>1st Half</span><span>${htT}</span></div><div class="row"><span>Home</span><span>${m.home_team}</span></div><div class="row"><span>Away</span><span>${m.away_team}</span></div></div><div class="card"><div class="blackHead">1st Half: ${htT}</div>${renderEv(ev1)}</div><div class="card"><div class="blackHead">2nd Half: FT</div>${renderEv(ev2)}</div>`;

 document.getElementById('stats').innerHTML=`<div class="card"><div class="head">STATS - Highlightly</div><div class="row">No stats from Highlightly yet</div></div>`;
 document.getElementById('table').innerHTML=`<div class="card"><div class="head">STANDINGS - ${m.league_name}</div><div class="row">Loading Highlightly standings...</div></div>`;
 try{
  let r=await fetch(`/api/standings?league_id=${m.league_id}`); let j=await r.json(); let tbl=j.data||[];
  if(tbl.length){
   let html=`<div style="background:#fff;color:#000;border-radius:12px;margin:10px"><div style="background:#006400;color:#fff;padding:10px;font-weight:900">${m.league_name} - Highlightly</div><table class="stand-table"><tr><th>#</th><th>Team</th><th>MP</th><th>Pts</th></tr>`;
   tbl.forEach(row=>{ html+=`<tr><td>${row.position||''}</td><td style="text-align:left;padding-left:8px">${row.team?.name||row.name}</td><td>${row.played||0}</td><td><b>${row.points||0}</b></td></tr>`; });
   html+=`</table></div>`; document.getElementById('table').innerHTML=html;
  } else document.getElementById('table').innerHTML=`<div class="card"><div class="row">No standings for this league</div></div>`;
 }catch(e){ document.getElementById('table').innerHTML=`<div class="card"><div class="row">No standings</div></div>`; }
 document.getElementById('h2h').innerHTML=`<div class="card"><div class="head">H2H - Highlightly</div><div class="row">No H2H data</div></div>`;
}
load();showTab('details',document.getElementById('b1'));
</script>
</body>
</html>
