<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match - Last 5 H2H</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;display:flex;justify-content:space-between;color:#000;font-weight:900}
.header a{background:#fff;color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700}
.scorebox{background:#151515;padding:30px 20px;text-align:center;border-bottom:3px solid #00ff66}
.teams{font-size:26px;font-weight:900;margin:15px 0}
.score{font-size:56px;color:#00ff66;font-weight:900}
.vs{color:#555}
.time-big{color:#00ff66;font-size:22px;font-weight:900}
.tabs{display:flex;background:#121212;position:sticky;top:0}
.tabs button{flex:1;background:#121212;color:#aaa;border:0;padding:16px;font-weight:900}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00ff66}
.content{padding:12px}
.card{background:#151515;border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:14px}
.row.head{color:#00ff66;font-weight:900;background:#1f1f1f;border-radius:10px}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore</span><a href="/">← Back</a></div>
<div id="top" class="scorebox">Loading...</div>
<div class="tabs">
<button id="b1" class="active" onclick="tab('details',this)">DETAILS</button>
<button onclick="tab('stats',this)">STATS</button>
<button onclick="tab('table',this)">TABLE</button>
<button onclick="tab('h2h',this)">H2H</button>
</div>
<div id="details" class="content"></div>
<div id="stats" class="content" style="display:none"></div>
<div id="table" class="content" style="display:none"></div>
<div id="h2h" class="content" style="display:none"></div>
<script>
function tab(n,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.content').forEach(c=>c.style.display='none');document.getElementById(n).style.display='block';}
async function load(){
let raw=localStorage.getItem('selected_match');
if(!raw){document.getElementById('top').innerHTML="No match - go home";return}
let m=JSON.parse(raw);
let id=m.id,home=m.home_team,away=m.away_team,league=m.league_name,zone=m.league_zone||"",hS=m.home_score,aS=m.away_score,st=m.status,mi=m.minute||"",dt=m.datetime||"",lid=m.league_id,hid=m.home_id,aid=m.away_id;
let tOnly=(dt.split(' ')[1]||'').slice(0,5),dOnly=dt.split(' ')[0]||'';
let sHTML=hS==null?`<div class="vs">VS</div><div class="time-big">🕘 ${tOnly}</div><div>${dOnly}</div><div style="color:#00ff66;margin-top:10px;font-weight:900">${st}</div>`:`<div class="score">${hS} - ${aS}</div><div style="color:${st=='LIVE'?'#ff3b30':'#aaa'};font-weight:900">${st} ${mi}</div><div style="color:#666;font-size:11px">${dt}</div>`;
document.getElementById('top').innerHTML=`<div style="color:#888;font-size:12px">${zone} - ${league}</div><div class="teams">${home}<br><span class="vs">vs</span><br>${away}</div>${sHTML}`;
document.getElementById('details').innerHTML=`<div class="card"><div class="row head"><span>MATCH INFO</span></div><div class="row"><span>League</span><span>${league}</span></div><div class="row"><span>Kick-off</span><span>${dt}</span></div><div class="row"><span>Status</span><span>${st} ${mi}</span></div><div class="row"><span>Home ID</span><span>${hid}</span></div><div class="row"><span>Away ID</span><span>${aid}</span></div></div><div class="card"><div class="row head"><span>EVENTS</span></div><div id="ev">Loading...</div></div>`;
try{let r=await fetch(`/api/events?id=${id}`);let j=await r.json();let ev=j.data||[];document.getElementById('ev').innerHTML=ev.length?ev.map(e=>`<div class="row"><span>⏱ ${e.minute}' ${e.event_type} ${e.player_name||''}</span><span>${e.team_side||''}</span></div>`).join(''):`<div style="padding:15px;color:#666;text-align:center">No events yet</div>`;}catch(e){document.getElementById('ev').innerHTML='Error';}
document.getElementById('stats').innerHTML=`<div class="card"><div class="row head"><span>STATS Loading...</span></div></div>`;
try{let r=await fetch(`/api/stats?id=${id}`);let j=await r.json();let html=`<div class="card"><div class="row head"><span>STATS</span></div>`;if(j.success&&j.available){let h=j.data.home,a=j.data.away;html+=`<div class="row"><span>Shots</span><span>${h.shots||0} - ${a.shots||0}</span></div><div class="row"><span>On Target</span><span>${h.shots_on_target||0} - ${a.shots_on_target||0}</span></div><div class="row"><span>Passes</span><span>${h.total_passes||0} - ${a.total_passes||0}</span></div><div class="row"><span>Fouls</span><span>${h.fouls||0} - ${a.fouls||0}</span></div>`;}else{html+=`<div style="padding:20px;color:#888;text-align:center">Stats LIVE/Finished only</div>`;}html+='</div>';document.getElementById('stats').innerHTML=html;}catch(e){document.getElementById('stats').innerHTML='Error';}
document.getElementById('table').innerHTML=`<div class="card"><div class="row head"><span>TABLE Loading...</span></div></div>`;
try{let r=await fetch(`/api/standings?id=${lid}`);let j=await r.json();let html=`<div class="card"><div class="row head"><span>${league} TABLE</span></div>`;if(j.data){j.data.slice(0,15).forEach(t=>{html+=`<div class="row"><span>${t.position}. ${t.team.name}</span><span style="color:#00ff66;font-weight:900">${t.points} pts</span></div>`;});}html+='</div>';document.getElementById('table').innerHTML=html;}catch(e){document.getElementById('table').innerHTML='Error table';}
// H2H LAST 5 - FULL
document.getElementById('h2h').innerHTML=`<div class="card"><div class="row head"><span>LOADING LAST 5 H2H...</span></div><div style="padding:10px;color:#888;font-size:11px">ID: ${hid} vs ${aid}</div></div>`;
try{
let r=await fetch(`/api/h2h?team1=${hid}&team2=${aid}`);
let j=await r.json();
let games=j.data||j||[];
let last5=games.slice(0,5);
let html=`<div class="card"><div class="row head"><span>LAST 5 - ${home} vs ${away}</span></div>`;
if(last5.length>0){
last5.forEach(g=>{
let d=(g.datetime||'').split(' ')[0]||'';
let win=g.home_score>g.away_score?g.home_team:g.away_score>g.home_score?g.away_team:'DRAW';
html+=`<div class="row"><span style="font-size:11px;color:#888">${d}<br><b style="color:#fff;font-size:13px">${g.home_team} ${g.home_score} - ${g.away_score} ${g.away_team}</b></span><span style="color:${win=='DRAW'?'#888':'#00ff66'};font-weight:900;font-size:11px">${win}</span></div>`;
});
let hw=last5.filter(g=> (g.home_team==home && g.home_score>g.away_score) || (g.away_team==home && g.away_score>g.home_score)).length;
let aw=last5.filter(g=> (g.home_team==away && g.home_score>g.away_score) || (g.away_team==away && g.away_score>g.home_score)).length;
html+=`<div class="row head"><span>H2H STATS LAST 5</span></div><div class="row"><span>${home} Wins</span><span style="color:#00ff66;font-weight:900">${hw}</span></div><div class="row"><span>${away} Wins</span><span style="color:#00ff66;font-weight:900">${aw}</span></div><div class="row"><span>Draws</span><span>${5-hw-aw}</span></div>`;
}else{
html+=`<div style="padding:20px;color:#888;text-align:center">No H2H history<br>IDs ${hid} vs ${aid}<br>Try Premier League match</div>`;
}
html+='</div>';
document.getElementById('h2h').innerHTML=html;
}catch(e){
document.getElementById('h2h').innerHTML=`<div class="card"><div class="row head"><span>H2H ERROR</span></div><div style="padding:15px;color:#ff5555">Error: ${e.message}<br>Check index.html saves home_id away_id</div></div>`;
}
}
load();tab('details',document.getElementById('b1'));
</script>
</body>
</html>
