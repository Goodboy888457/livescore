<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINGDOM - Flashscore.mobi Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:Arial;font-size:13px}
a{color:#00a000;text-decoration:none;font-weight:bold}
a:hover{text-decoration:underline}
.header{background:#000;color:#fff;padding:8px;text-align:center;font-weight:bold}
.green-bar{background:#1a9c00;color:#fff;padding:6px;text-align:center;font-weight:bold;font-size:12px}
.top-menu{background:#eee;padding:5px;border-bottom:1px solid #ccc;font-size:12px}
.league-head{background:#000;color:#fff;padding:6px 8px;font-weight:bold;margin-top:2px;cursor:pointer}
.league-head span{color:#ffff00}
.match-line{padding:4px 8px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
.standings-table{width:100%;border-collapse:collapse;font-size:12px}
.standings-table th{background:#000;color:#fff;padding:4px;text-align:left}
.standings-table td{padding:3px 4px;border-bottom:1px solid #ddd}
.standings-table tr:nth-child(even){background:#f0f0f0}
.back-link{background:#eee;padding:8px;font-weight:bold;display:block;border-bottom:1px solid #ccc}
</style>
</head>
<body>

<div class="header">FLASHSCORE - KINGDOM 2026/27</div>
<div class="green-bar">📖 Matt 6:33 - REAL APISPORT - Tap STANDINGS</div>

<div class="top-menu">
  <span onclick="loadGames('today')" style="cursor:pointer;font-weight:bold;">Today</span> | 
  <span onclick="loadGames('yest')" style="cursor:pointer;">Yesterday</span> | 
  <span onclick="loadGames('tomo')" style="cursor:pointer;">Tomorrow</span> | 
  <span onclick="loadGames('live')" style="cursor:pointer;color:red;">LIVE</span> | 
  <span onclick="showAllLeagues()" style="cursor:pointer;font-weight:bold;">All Games</span> | 
  <span onclick="showStandingsList()" style="cursor:pointer;font-weight:bold;color:#00a000;">Standings List</span>
</div>

<div id="content">
  <div style="padding:20px;text-align:center;">⏳ Loading leagues...</div>
</div>

<script>
let allLeaguesCache = [];

// LOAD ALL LEAGUES LIKE YOUR VIDEO
async function showAllLeagues(){
  document.getElementById('content').innerHTML = '<div style="padding:10px;">⏳ Loading matches from APISPORT...</div>';
  try{
    let res = await fetch('/api/fixtures?day=today');
    let json = await res.json();
    let matches = json.response || [];
    
    if(!matches.length){
      showStandingsList();
      return;
    }
    
    // Group by league like flashscore.mobi
    let grouped = {};
    matches.forEach(m=>{
      let key = `${m.league?.country||'World'} - ${m.league?.name||'League'}`;
      if(!grouped[key]) grouped[key] = { league: m.league, matches: [] };
      grouped[key].matches.push(m);
    });
    
    let html = '<div><div style="background:#000;color:#fff;padding:6px;font-weight:bold;">Football - Today - All Games <span style="float:right;cursor:pointer;" onclick="location.reload()">REFRESH NOW</span></div>';
    
    Object.keys(grouped).forEach(leagueKey=>{
      let g = grouped[leagueKey];
      let slug = g.league?.slug || 'premier-league';
      let country = g.league?.country || 'England';
      let name = g.league?.name || leagueKey;
      
      html += `<div class="league-head" onclick="loadTable('${slug}','${name}','${country}')">
        ${country.toUpperCase()}: ${name} - <span>Standings</span>
      </div>`;
      
      g.matches.slice(0,5).forEach(m=>{
        let home = m.teams?.home?.name || 'Home';
        let away = m.teams?.away?.name || 'Away';
        let hs = m.goals?.home ?? 0;
        let as = m.goals?.away ?? 0;
        html += `<div class="match-line">
          <span>${home} - ${away}</span>
          <span><b>${hs}:${as}</b></span>
        </div>`;
      });
    });
    
    html += '</div>';
    document.getElementById('content').innerHTML = html;
  }catch(e){
    document.getElementById('content').innerHTML = `<div style="padding:20px;">Error: ${e.message}<br><br>Make sure /api/fixtures.js exists! Check previous message.</div>`;
  }
}

// SHOW STANDINGS LIST LIKE IN YOUR VIDEO - ENGLAND Premier League Standings etc
async function showStandingsList(){
  document.getElementById('content').innerHTML = '<div style="padding:10px;">⏳ Loading all leagues...</div>';
  try{
    let res = await fetch('/api/leagues');
    let json = await res.json();
    allLeaguesCache = json.response || [];
    
    let html = '<div><div style="background:#000;color:#fff;padding:6px;font-weight:bold;">Football - Today - All Games</div>';
    html += '<div style="padding:4px;background:#ffffcc;font-size:11px;">Advertisement - Tap LEAGUE for TABLE</div>';
    
    // Group like flashscore: ENGLAND Premier League Standings
    let byCountry = {};
    allLeaguesCache.forEach(l=>{
      if(!byCountry[l.country]) byCountry[l.country] = [];
      byCountry[l.country].push(l);
    });
    
    Object.keys(byCountry).sort().forEach(country=>{
      byCountry[country].forEach(l=>{
        html += `<div class="league-head" onclick="loadTable('${l.slug}','${l.name}','${country}')">
          ${country.toUpperCase()}: ${l.name} - <span>Standings</span>
        </div>`;
      });
    });
    
    html += '</div>';
    document.getElementById('content').innerHTML = html;
  }catch(e){
    document.getElementById('content').innerHTML = `Error: ${e.message}`;
  }
}

// LOAD TABLE LIKE YOUR VIDEO - # Team MP W D L G PTS
async function loadTable(slug, name, country){
  document.getElementById('content').innerHTML = `
    <a class="back-link" onclick="showStandingsList()" style="cursor:pointer;">⬅ Back | REFRESH NOW</a>
    <div style="background:#000;color:#fff;padding:6px;font-weight:bold;">Football - ${country}: ${name} - Standings</div>
    <div style="padding:20px;text-align:center;">⏳ Loading ${name} table...</div>
  `;
  
  try{
    let res = await fetch(`/api/table?leagueName=${slug}`);
    let json = await res.json();
    let table = json.response || [];
    
    if(!table.length){
      document.getElementById('content').innerHTML = `
        <a class="back-link" onclick="showStandingsList()" style="cursor:pointer;">⬅ Back</a>
        <div style="background:#000;color:#fff;padding:6px;">Football - ${country}: ${name} - Standings</div>
        <div style="padding:15px;">No table - Cup competition or no data.<br><br>Try: premier-league, laliga, bundesliga, serie-a, ligue-1</div>
      `;
      return;
    }
    
    let html = `
      <a class="back-link" onclick="showStandingsList()" style="cursor:pointer;">⬅ Back | REFRESH NOW</a>
      <div style="background:#000;color:#fff;padding:6px;font-weight:bold;">Football - ${country}: ${name} - Standings</div>
      <table class="standings-table">
        <tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>G</th><th>PTS</th></tr>
    `;
    
    table.forEach(row=>{
      html += `<tr>
        <td>${row.rank}</td>
        <td><b>${row.team.name}</b></td>
        <td>${row.played||0}</td>
        <td>${row.won||0}</td>
        <td>${row.drawn||0}</td>
        <td>${row.lost||0}</td>
        <td>${row.goalsFor||0}:${row.goalsAgainst||0}</td>
        <td><b>${row.points}</b></td>
      </tr>`;
    });
    
    html += `</table>
      <div style="padding:8px;background:#eee;font-size:11px;">
        <a onclick="showStandingsList()" style="cursor:pointer;">Extended table</a><br>
        <a onclick="showStandingsList()" style="cursor:pointer;">Back | Top</a><br><br>
        Flashscore.mobi clone - Kingdom 2026/27 - Tap any league for standings
      </div>
    `;
    
    document.getElementById('content').innerHTML = html;
  }catch(e){
    document.getElementById('content').innerHTML = `Error: ${e.message}`;
  }
}

function loadGames(day){
  // For now just show standings list, fixtures endpoint needed
  showAllLeagues();
}

// START WITH STANDINGS LIST LIKE YOUR VIDEO
showStandingsList();
</script>

</body>
</html>
