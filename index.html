<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kingdom Livescore 2026/27</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#0f1419;color:#fff}header{background:#1a2530;padding:12px 15px;display:flex;justify-content:space-between;border-bottom:2px solid #00c853;position:sticky;top:0;z-index:20}.logo{font-weight:900;font-size:20px;color:#00c853}.logo span{color:#fff}.live-dot{background:#ff3b30;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}.tabs{display:flex;background:#131d27;border-bottom:1px solid #1e2e3e;position:sticky;top:52px;z-index:10}.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}.tab.active{border-bottom:2px solid #00c853;color:#00c853;background:#1a2530}.search{background:#131d27;padding:10px 15px}.search input{width:100%;padding:10px;border-radius:20px;border:1px solid #2a3a4a;background:#1e2e3e;color:#fff;outline:none}.verse{background:#00c853;color:#000;padding:6px 15px;text-align:center;font-size:11px;font-weight:700}.league{background:#1e2e3e;padding:10px 15px;font-weight:700;font-size:13px;border-top:1px solid #2a3a4a;display:flex;justify-content:space-between}.match{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid #1e2e3e;font-size:14px;cursor:pointer;background:#131d27}.match:hover{background:#1a2530}.match.live{border-left:3px solid #ff3b30}.time{width:55px;font-size:12px;color:#00c853;font-weight:700}.teams{flex:1}.team{display:flex;justify-content:space-between;padding:1px 0}.score{font-weight:700;background:#2a3a4a;padding:1px 6px;border-radius:3px;min-width:24px;text-align:center}.status{width:40px;text-align:right;font-size:11px;color:#ff3b30}.loading{text-align:center;padding:40px;color:#8b9bb4;line-height:1.6}#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:20px}#modalBox{background:#1a2530;width:100%;max-width:400px;border-radius:12px;overflow:hidden;border:1px solid #2a3a4a}.modalHead{background:#1e2e3e;padding:12px 15px;display:flex;justify-content:space-between;font-weight:700}.closeBtn{cursor:pointer;background:#ff3b30;padding:2px 8px;border-radius:4px}.modalBody{padding:15px;font-size:13px}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3a4a}.refresh{position:fixed;bottom:20px;right:20px;background:#00c853;color:#000;width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer}</style></head><body><header><div class="logo">KINGDOM <span>2026/27</span></div><div class="live-dot" id="count">● REAL LIVE</div></header><div class="verse">📖 2026/27 - Seek ye first the Kingdom</div><div class="tabs"><div class="tab active" onclick="switchTab('live',this)">LIVE</div><div class="tab" onclick="switchTab('today',this)">TODAY</div><div class="tab" onclick="switchTab('finished',this)">FT</div><div class="tab" onclick="openTable()">TABLE</div></div><div class="search"><input id="search" placeholder="🔍 Search team..." onkeyup="searchTeam()"></div><div id="content"><div class="loading">⏳ Loading REAL LIVE...</div></div><div class="refresh" onclick="load()">↻</div><div id="modal" onclick="closeModal()"><div id="modalBox" onclick="event.stopPropagation()"><div class="modalHead"><span id="mTitle">Match</span><span class="closeBtn" onclick="closeModal()">X</span></div><div class="modalBody" id="mBody"></div></div></div><script>let current='live';async function load(){let c=document.getElementById('content');c.innerHTML='<div class=loading>⏳ Loading '+current+'...</div>';try{let r=await fetch('/api/live?type='+current);let d=await r.json();let f=d.response||[];if(f.length==0){c.innerHTML='<div class=loading>No games for '+current+'<br>Try TODAY tab</div>';return}document.getElementById('count').innerText='● '+f.length;render(f)}catch(e){c.innerHTML='<div class=loading>Error: '+e.message+'</div>'}}function render(fixtures){let l={};fixtures.forEach(x=>{let n=x.league.name+' - '+x.league.country;if(!l[n])l[n]=[];l[n].push(x)});let h='';for(let k in l){h+=`<div class="league">${k} (${l[k].length})</div>`;l[k].forEach(f=>{let t=f.fixture.status.elapsed?f.fixture.status.elapsed+"'":f.fixture.status.short;let isLive=['1H','2H','HT','LIVE'].includes(f.fixture.status.short)?'live':'';h+=`<div class="match ${isLive}" onclick="openMatch('${f.teams.home.name} vs ${f.teams.away.name}','${t}','${f.goals.home??0}-${f.goals.away??0}','${k}')"><div class="time">${t}</div><div class="teams"><div class="team"><span>${f.teams.home.name}</span><span class="score">${f.goals.home??0}</span></div><div class="team"><span>${f.teams.away.name}</span><span class="score">${f.goals.away??0}</span></div></div><div class="status">${f.fixture.status.short}</div></div>`})}document.getElementById('content').innerHTML=h}function switchTab(t,el){current=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');load()}function openMatch(ti,time,sc,info){document.getElementById('mTitle').innerText=ti;document.getElementById('mBody').innerHTML=`<div class=stat><span>Score</span><b>${sc}</b></div><div class=stat><span>Time</span><span>${time}</span></div><div class=stat><span>League</span><span>${info}</span></div><br><button onclick="closeModal()" style="width:100%;padding:12px;background:#00c853;border:none;border-radius:8px;font-weight:700">Close</button>`;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function searchTeam(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.match').forEach(m=>{m.style.display=m.innerText.toLowerCase().includes(q)?'flex':'none'})}async function openTable(){let leagueId=prompt("TABLE 2026/27\n39=Prem\n140=LaLiga\n135=SerieA\n78=Bundes\n61=Ligue1\n2=UCL","39");if(!leagueId)return;document.getElementById('content').innerHTML='<div class=loading>⏳ Loading 2026/27 table...</div>';try{let r=await fetch('/api/table?league='+leagueId+'&season=2026');let d=await r.json();if(!d.response||d.response.length==0||d.response[0].league.standings[0].length==0){document.getElementById('content').innerHTML='<div class=loading>2026/27 not ready, trying 2025/26...</div>';r=await fetch('/api/table?league='+leagueId+'&season=2025');d=await r.json()}let table=d.response[0].league.standings[0];let html=`<div class=league>${d.response[0].league.name} ${d.response[0].league.season}/${d.response[0].league.season+1}</div><div style="display:flex;padding:8px 15px;font-size:11px;font-weight:700;background:#1a2530"><span style="width:30px">#</span><span style="flex:1">Team</span><span style="width:25px">P</span><span style="width:25px">W</span><span style="width:30px">Pts</span></div>`;table.forEach(t=>{html+=`<div class="match"><div style="width:30px;font-weight:700;color:${t.rank<=4?'#00c853':''}">${t.rank}</div><div style="flex:1;display:flex;align-items:center"><img src="${t.team.logo}" style="width:18px;height:18px;margin-right:6px">${t.team.name}</div><div style="width:25px">${t.all.played}</div><div style="width:25px">${t.all.win}</div><div style="width:30px;font-weight:700">${t.points}</div></div>`});document.getElementById('content').innerHTML=html}catch(e){document.getElementById('content').innerHTML='<div class=loading>Table error: '+e.message+'<br>Note: 2026/27 go ready August. Try 39</div>'}}load();setInterval(load,60000);</script></body></html>
