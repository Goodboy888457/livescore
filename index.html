<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore - All Leagues Fixed</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;font-weight:900;color:#000;display:flex;justify-content:space-between;align-items:center}
.header a{background:#fff;color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:12px;font-weight:900}
.tabs{display:flex;gap:8px;padding:10px;background:#111;overflow:auto;justify-content:center}
.tabs button{background:#222;color:#aaa;border:1px solid #333;padding:10px 24px;border-radius:20px;font-weight:900;font-size:14px;white-space:nowrap}
.tabs button.active{background:#00ff00;color:#000;border-color:#00ff00}
.filter{display:flex;gap:8px;padding:10px;justify-content:center}
.filter button{background:#111;color:#00ff00;border:1.5px solid #00ff00;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600}
.filter button.active{background:#00ff00;color:#000;font-weight:900}
.league-head{background:#00ff00;color:#000;padding:8px 12px;font-weight:900;margin-top:10px;font-size:13px;display:flex;gap:6px;align-items:center}
.match{display:flex;align-items:center;padding:12px;background:#151515;margin:6px 8px;border-radius:10px;border-left:3px solid #00c853}
.time{border:1.5px solid #00c853;border-radius:20px;padding:5px 0;color:#00c853;font-weight:900;font-size:13px;min-width:52px;text-align:center}
.teams{flex:1;margin-left:12px;line-height:18px;font-size:14px}
.teams div:first-child{font-weight:600}
.score{color:#00ff66;font-weight:900;font-size:17px;min-width:50px;text-align:right}
.info{color:#666;font-size:11px;padding:8px;text-align:center}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore - All Leagues</span><a href="#" onclick="location.reload();return false;">↻ Refresh</a></div>
<div class="tabs" id="dateTabs"></div>
<div class="filter">
<button id="f-all" class="active" onclick="setFilter('all')">All Games</button>
<button id="f-live" onclick="setFilter('live')">Live</button>
<button id="f-fin" onclick="setFilter('finished')">Finished</button>
</div>
<div id="list" style="padding:20px;text-align:center">Loading...</div>
<script>
let all=[],cur='all',curDate='';
const FLAGS={"England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Wales":"🏴󠁧󠁢󠁷󠁬󠁳󠁿","Scotland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Northern Ireland":"🏴󠁧󠁢󠁮󠁩󠁲󠁿","Spain":"🇪🇸","France":"🇫🇷","Germany":"🇩🇪","Italy":"🇮🇹","Netherlands":"🇳🇱","Portugal":"🇵🇹","Belgium":"🇧🇪","Turkey":"🇹🇷","Greece":"🇬🇷","Brazil":"🇧🇷","Argentina":"🇦🇷","USA":"🇺🇸","Japan":"🇯🇵","Nigeria":"🇳🇬","World":"🌍","WORLD":"🌍","Europe":"🏆","Australia":"🇦🇺","Austria":"🇦🇹","Malta":"🇲🇹","Denmark":"🇩🇰","Sweden":"🇸🇪","Norway":"🇳🇴","Poland":"🇵🇱","Ireland":"🇮🇪","Switzerland":"🇨🇭","Croatia":"🇭🇷","Serbia":"🇷🇸","Czech Republic":"🇨🇿","Romania":"🇷🇴","Mexico":"🇲🇽","Chile":"🇨🇱","Saudi Arabia":"🇸🇦","Egypt":"🇪🇬","South Africa":"🇿🇦"};
function getFlag(c){return FLAGS[c]||"⚽";}
const TOP_ORDER=[{k:'CHAMPIONS LEAGUE',p:1},{k:'EUROPA LEAGUE',p:2},{k:'EUROPA CONFERENCE',p:3},{k:'PREMIER LEAGUE',p:4},{k:'LALIGA',p:5},{k:'LIGUE 1',p:6},{k:'BUNDESLIGA',p:7},{k:'SERIE A',p:8},{k:'EREDIVISIE',p:9},{k:'BRASILEIRO',p:10},{k:'CYMRU PREMIER',p:11},{k:'MALTESE',p:12},{k:'PREMIER LEAGUE 2',p:13},{k:'U21',p:14}];
function getP(n){let f=n.toUpperCase();for(let t of TOP_ORDER) if(f.includes(t.k)) return t.p; return 80;}

function tabs(){
  let h='', today=new Date();
  let saved = localStorage.getItem('lastDate');
  // ONLY -1, 0, +1 = Yesterday, Today, Tomorrow
  for(let i=-1;i<=1;i++){
    let d=new Date(today);
    d.setDate(today.getDate()+i);
    let ds=d.toISOString().split('T')[0];
    let label = i===-1 ? 'Yesterday' : i===0 ? 'Today' : 'Tomorrow';
    let active = (saved===ds) || (!saved && i===0) ? 'active' : '';
    if(active) curDate=ds;
    h+=`<button class="${active}" onclick="goDate('${ds}',this)">${label}</button>`;
  }
  document.getElementById('dateTabs').innerHTML=h;
}

function goDate(ds,el){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  localStorage.setItem('lastDate',ds);
  load(ds);
}

async function load(d){
  curDate=d;
  localStorage.setItem('lastDate',d);
  document.getElementById('list').innerHTML='Loading '+d+'...';
  try{
    let r=await fetch('/api/fixtures?date='+d);
    let j=await r.json();
    if(!j.success) throw new Error(j.error||'API error');
    all=j.data||[];
    if(!all.length){
      document.getElementById('list').innerHTML='<div class="info">No matches scheduled for '+d+'<br>Free plan only has real fixtures for Yesterday/Today/Tomorrow</div>';
      return;
    }
    show();
  }catch(e){
    document.getElementById('list').innerHTML='<div style="color:#ff3b30">Error: '+e.message+'</div>';
    all=[];
  }
}

function setFilter(f){
  cur=f;
  document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));
  let id = f==='finished' ? 'f-fin' : 'f-'+f;
  document.getElementById(id).classList.add('active');
  show();
}

function getTime(m){
  let st=(m.status||'').toUpperCase();
  if(['1H','2H','HT','ET','BT','P','LIVE','IN_PLAY'].includes(st)){
    return {t: m.minute ? m.minute+"'" : 'LIVE', c:'#ff3b30'};
  }
  if(['FT','AET','PEN','AWD','WO'].includes(st)) return {t:'FT',c:'#00c853'};
  try{
    if(m.kickoff_utc){
      let dt=new Date(m.kickoff_utc);
      if(!isNaN(dt)) return {t: dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}), c:'#00c853'};
    }
  }catch(e){}
  return {t:'NS',c:'#00c853'};
}

function show(){
  let data=[...all];
  if(cur==='live') data=data.filter(x=>['LIVE','1H','2H','HT','ET','BT','P','IN_PLAY'].includes((x.status||'').toUpperCase()));
  if(cur==='finished') data=data.filter(x=>['FT','AET','PEN','FINISHED','AWD'].includes((x.status||'').toUpperCase()));
  if(!data.length){
    document.getElementById('list').innerHTML='<div class="info">No '+cur+' matches for '+curDate+'</div>';
    return;
  }
  let g={};
  data.forEach(m=>{
    let k=m.league_zone+' - '+m.league_name;
    if(!g[k]) g[k]={name:k,country:m.league_zone,pri:getP(m.league_name),games:[]};
    g[k].games.push(m);
  });
  let keys=Object.keys(g).sort((a,b)=>g[a].pri-g[b].pri);
  let html='<div class="info">api-football: '+data.length+' matches • '+keys.length+' leagues • '+curDate+'</div>';
  keys.forEach(k=>{
    let gr=g[k];
    let flag=getFlag(gr.country);
    html+='<div class="league-head">'+flag+' '+gr.name+' ('+gr.games.length+')</div>';
    gr.games.forEach(x=>{
      let sc=(x.home_score!=null&&x.away_score!=null)?x.home_score+' - '+x.away_score:'- : -';
      let tm=getTime(x);
      html+='<div class="match"><div class="time" style="color:'+tm.c+';border-color:'+tm.c+'">'+tm.t+'</div><div class="teams"><div>'+x.home_team+'</div><div>'+x.away_team+'</div></div><div class="score">'+sc+'</div></div>';
    });
  });
  document.getElementById('list').innerHTML=html;
}

tabs();
let init = localStorage.getItem('lastDate') || new Date().toISOString().split('T')[0];
// force init to be within -1,0,1
let today = new Date();
let validDates = [];
for(let i=-1;i<=1;i++){let d=new Date(today);d.setDate(today.getDate()+i);validDates.push(d.toISOString().split('T')[0]);}
if(!validDates.includes(init)) init = new Date().toISOString().split('T')[0];
load(init);
</script>
</body>
</html>
