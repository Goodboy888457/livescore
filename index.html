<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naija Forum - Nairaland Clone</title>
<style>
body{margin:0;background:#101010;font-family:Verdana;color:#d0d0d0}
.wrap{max-width:900px;margin:auto}
.card{background:#1a2e22;border-radius:18px;margin:10px;padding:14px;border:1px solid #2d4a35}
.logo{color:#8ee08e;text-align:center;font-size:22px;font-weight:900;text-decoration:line-through}
.top{line-height:1.8;font-size:13px;text-align:center}
.top a{color:#b78a52;text-decoration:none;cursor:pointer}
.o{color:#e0a05a;font-weight:bold}
.authbox{background:#f6efe0;color:#000;padding:12px;margin:10px;border-radius:10px;text-align:center}
.authbox input{width:44%;padding:8px;margin:4px;border:1px solid #aaa;border-radius:6px}
.authbox button{background:#2e5a23;color:#fff;border:none;padding:8px 14px;font-weight:bold;border-radius:6px;margin:4px;cursor:pointer}
.newbox{background:#f6efe0;color:#000;padding:10px;margin:10px;border-radius:8px}
.newbox input,.newbox textarea,.newbox select{width:100%;padding:7px;margin:4px 0}
.thread{background:#f9f3e2;color:#000;padding:9px 10px;border-bottom:1px solid #d1c1a0}
.thread a{color:#2e5a23;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<p class="logo">Nairaland Forum</p>
<div class="top" id="topbar">Loading...</div>
<div style="display:flex;justify-content:center;gap:6px;margin-top:8px">
<input id="q" placeholder="Search news..." oninput="doSearch()" style="width:65%;padding:8px;border-radius:20px;background:#0f1f15;color:#fff;border:1px solid #333">
<button>Search</button>
</div>
</div>

<div class="authbox" id="authbox">
<b>Guests can read news, but login to post</b><br>
<input id="au" placeholder="Username">
<input id="ap" type="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
<button onclick="doRegister()" style="background:#e0a05a;color:#000">Register</button>
<div id="amsg" style="font-size:12px;color:red;margin-top:4px"></div>
</div>

<div class="newbox" id="postbox">
<b id="postTitle">Create Topic</b><br>
<input id="tt" placeholder="Topic Title">
<select id="ts"><option>Politics</option><option>Business</option><option>Sports</option><option>Betting</option><option>General</option></select>
<textarea id="tc" rows="3" placeholder="Write news..."></textarea>
<button id="postBtn" onclick="postT()">Post Topic</button>
</div>

<div id="list">Loading news...</div>
</div>

<script>
let ALL=[], USER = JSON.parse(localStorage.getItem('nl_user')||'null');
function updateUI(){
 if(USER){
  topbar.innerHTML='Welcome, <span class="o">'+USER.username+'</span>(m): <a onclick="logout()">Logout(all)</a> - Stats: 3,345,014 members, '+ALL.length+' topics';
  authbox.style.display='none';
  postTitle.innerText='Welcome '+USER.username+' - Create Topic';
 }else{
  topbar.innerHTML='Welcome, Guest: <a onclick="document.getElementById(\'au\').focus()">Login</a> - Register - Stats: 3,345,014 members';
  authbox.style.display='block';
  postTitle.innerText='Login to Create Topic';
 }
}
async function doLogin(){
 let u=au.value.trim(), p=ap.value.trim(); if(!u||!p) return amsg.innerText='Fill all';
 let r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:u,password:p})});
 let j=await r.json(); if(!j.success){amsg.innerText=j.error;return;}
 localStorage.setItem('nl_user', JSON.stringify(j.user)); location.reload();
}
async function doRegister(){
 let u=au.value.trim(), p=ap.value.trim(); if(!u||!p) return amsg.innerText='Fill all';
 let r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register',username:u,password:p})});
 let j=await r.json(); if(!j.success){amsg.innerText=j.error;return;} amsg.style.color='green'; amsg.innerText='Registered! Now Login';
}
function logout(){ localStorage.removeItem('nl_user'); location.reload(); }
async function load(){ let r=await fetch('/api/forum'); let j=await r.json(); ALL=j.data||[]; updateUI(); render(ALL); }
function render(arr){
 let h=''; arr.forEach(t=>{h+='<div class="thread"><a href="#" onclick="openT('+t.id+');return false">'+t.title+'</a> <div style="font-size:11px;color:#555">by '+t.author+' - '+t.section+'</div><div style="font-size:12px">'+(t.content||'').slice(0,120)+'...</div></div>'});
 document.getElementById('list').innerHTML=h||'<div class="thread">No news yet</div>';
}
function doSearch(){ let q=document.getElementById('q').value.toLowerCase(); render(ALL.filter(x=>x.title.toLowerCase().includes(q))); }
async function postT(){
 if(!USER){ alert('Login first to post'); au.focus(); return; }
 let title=tt.value.trim(), content=tc.value.trim(); if(!title||!content) return alert('Fill');
 await fetch('/api/forum',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,content,section:ts.value,author:USER.username})});
 tt.value='';tc.value=''; load();
}
function openT(id){
 let t=ALL.find(x=>x.id===id); if(!t) return;
 if(!USER){ if(confirm('Login to reply?')) au.focus(); return; }
 let r=prompt(t.title+'\n\n'+t.content+'\n\nReply:'); if(r) fetch('/api/forum/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thread_id:id,content:r,author:USER.username})});
}
load();
</script>
</body>
</html>
