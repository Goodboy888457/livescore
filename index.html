<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kingdom Livescore 2026/27 - REAL LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f1419;color:#fff}
header{background:#1a2530;padding:12px 15px;display:flex;justify-content:space-between;border-bottom:2px solid #00c853;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:20px;color:#00c853}.logo span{color:#fff}
.live-dot{background:#ff3b30;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tabs{display:flex;background:#131d27;border-bottom:1px solid #1e2e3e;position:sticky;top:52px;z-index:10}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{border-bottom:2px solid #00c853;color:#00c853;background:#1a2530}
.search{background:#131d27;padding:10px 15px}
.search input{width:100%;padding:10px;border-radius:20px;border:1px solid #2a3a4a;background:#1e2e3e;color:#fff;outline:none}
.verse{background:#00c853;color:#000;padding:6px 15px;text-align:center;font-size:11px;font-weight:700}
.league{background:#1e2e3e;padding:10px 15px;font-weight:700;font-size:13px;border-top:1px solid #2a3a4a;display:flex;justify-content:space-between}
.match{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid #1e2e3e;font-size:14px;cursor:pointer;background:#131d27}
.match:hover{background:#1a2530}.match.live{border-left:3px solid #ff3b30}
.time{width:60px;font-size:12px;color:#00c853;font-weight:700}
.teams{flex:1}.team{display:flex;justify-content:space-between;padding:1px 0}
.score{font-weight:700;background:#2a3a4a;padding:1px 6px;border-radius:3px;min-width:24px;text-align:center}
.status{width:45px;text-align:right;font-size:11px;color:#ff3b30}
.loading{text-align:center;padding:40px;color:#8b9bb4;line-height:1.6}
.refresh{position:fixed;bottom:20px;right:20px;background:#00c853;color:#000;width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">KINGDOM <span>2026/27</span></div><div class="live-dot" id="count">● REAL LIVE</div></header>
<div class="verse">📖 2026/27 Season - Seek ye first the Kingdom - Matt 6:33</div>
<div class="tabs">
<div class="tab active" id="tab-live" onclick="switchTab('live',this)">LIVE</div>
<div class="tab" id="tab-today" onclick="switchTab('today',this)">TODAY</div>
<div class="tab" id="tab-finished" onclick="switchTab('finished',this)">FT</div>
<div class="tab" onclick="openTable()">TABLE</div>
</div>
<div class="search"><input id="search" placeholder="🔍 Search team, league..." onkeyup="searchTeam()"></div>
<div id="content"><div class="loading">⏳ Loading REAL LIVE HIGH...</div></div>
<div class="refresh" onclick="load()">↻</div>
<script>
let allMatches = [];
let current='live';
async function load(){
 let c=document.getElementById('content');
 c.innerHTML='<div class=loading>⏳ Loading '+current.toUpperCase()+'...</div>';
 try{
  let r=await fetch('/api/live?type='+current);
  let d=await r.json();
  let f = Array.isArray(d) ? d : (d.data || d.response || d.matches || []);
  if(!Array.isArray(f)) f = [];
  allMatches = f;
  if(f.length===0){c.innerHTML='<div class=loading>✅ No games - Check /api/live</div>';return}
  
  let filtered = f;
  if(current==='live') filtered = f.filter(m=>['First half','Second half','Halftime','First half extra','Second half extra','Extra time','Penalties'].includes(m.state?.description));
  if(current==='finished') filtered = f.filter(m=>m.state?.description==='Finished');
  if(current==='today') filtered = f;
  
  if(filtered.length===0 && current==='live'){
    document.getElementById('count').innerText='● '+f.length+' TODAY';
    document.getElementById('content').innerHTML='<div class=loading>✅ No LIVE now<br>'+f.length+' games TODAY - Click TODAY tab</div>';
    return;
  }
  document.getElementById('count').innerText='● '+filtered.length+' '+current.toUpperCase();
  render(filtered)
 }catch(e){c.innerHTML='<div class=loading>Error: '+e.message+'</div>'}
}
function render(fixtures){
 let groups={};
 fixtures.forEach(x=>{
  let leagueName = x.league?.name || 'Football';
  if(!groups[leagueName]) groups[leagueName]=[];
  groups[leagueName].push(x)
 });
 let h='';
 for(let k in groups){
  h+=`<div class="league"><span>${k}</span><span>${groups[k].length}</span></div>`;
  groups[k].forEach(f=>{
   let home = f.homeTeam?.name || 'Home';
   let away = f.awayTeam?.name || 'Away';
   let scoreObj = f.state?.score?.current || f.state?.score || {};
   let homeScore = scoreObj?.home ?? 0;
   let awayScore = scoreObj?.away ?? 0;
   if(f.state?.description==='Not started'){homeScore=0;awayScore=0;}
   let timeRaw = f.state?.clock != null ? f.state.clock : (f.state?.description || 'NS');
   let time = String(timeRaw);
   let statusRaw = f.state?.description || 'NS';
   let status = String(statusRaw);
   let isLive = ['First half','Second half','Halftime','First half extra','Second half extra','Extra time','Penalties'].includes(f.state?.description);
   h+=`<div class="match ${isLive?'live':''}"><div class="time">${time.substring(0,12)}</div><div class="teams"><div class="team"><span>${home}</span><span class="score">${homeScore}</span></div><div class="team"><span>${away}</span><span class="score">${awayScore}</span></div></div><div class="status">${status.substring(0,5)}</div></div>`
  })
 }
 document.getElementById('content').innerHTML=h;
}
function switchTab(t,el){current=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');load()}
function searchTeam(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.match').forEach(m=>{m.style.display=m.innerText.toLowerCase().includes(q)?'flex':'none'})}
async function openTable(){
 let leagueName=prompt("TABLE - ALL LEAGUES\nType:\nPremier League\nLa Liga\nSerie A\nBundesliga\nLigue 1\nUEFA Champions League","Premier League");
 if(!leagueName) return;
 document.getElementById('content').innerHTML='<div class=loading>⏳ Loading '+leagueName+' TABLE...</div>';
 try{
  let r=await fetch('/api/table?leagueName='+encodeURIComponent(leagueName));
  let d=await r.json();
  let table = d.data || d.response || d.standings || d;
  if(Array.isArray(table) && table[0]?.standings) table=table[0].standings;
  if(table?.standings) table=table.standings;
  if(!Array.isArray(table) || table.length==0){document.getElementById('content').innerHTML='<div class=loading>No table for '+leagueName+'<br>Try Premier League</div>';return}
  let html=`<div class=league>${leagueName} Table - HIGH</div><div style="display:flex;padding:8px 15px;font-size:11px;font-weight:700;background:#1a2530"><span style="width:30px">#</span><span style="flex:1">Team</span><span style="width:25px">P</span><span style="width:35px">Pts</span></div>`;
  table.forEach((t,i)=>{
   let rank=t.position||t.rank||i+1;
   let name=t.team?.name||t.name||t.teamName||'Team';
   let pts=t.points||t.pts||0;
   let pl=t.played||t.matches||0;
   let color=rank<=4?'#00c853':rank>=18?'#ff3b30':'#fff';
   html+=`<div class="match"><div style="width:30px;font-weight:700;color:${color}">${rank}</div><div style="flex:1">${name}</div><div style="width:25px">${pl}</div><div style="width:35px;font-weight:900">${pts}</div></div>`
  });
  document.getElementById('content').innerHTML=html;
 }catch(e){document.getElementById('content').innerHTML='<div class=loading>Error: '+e.message+'</div>'}
}
load();
setInterval(load,60000);
</script>
</body>
</html>
