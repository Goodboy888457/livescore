<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore - Highlightly</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;font-weight:900;color:#000;display:flex;justify-content:space-between;align-items:center}
.header a{background:#fff;color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:12px;font-weight:900}
.tabs{display:flex;gap:8px;padding:10px;background:#111;overflow:auto}
.tabs button{background:#222;color:#aaa;border:1px solid #333;padding:8px 16px;border-radius:20px;font-weight:900;font-size:13px;white-space:nowrap}
.tabs button.active{background:#00ff00;color:#000}
.filter{display:flex;gap:8px;padding:10px}
.filter button{background:#111;color:#00ff00;border:1.5px solid #00ff00;padding:8px 18px;border-radius:20px;font-size:13px}
.filter button.active{background:#00ff00;color:#000;font-weight:900}
.league-head{background:#00ff00;color:#000;padding:8px 12px;font-weight:900;margin-top:10px;font-size:13px}
.match{display:flex;align-items:center;padding:12px;background:#151515;margin:6px 8px;border-radius:10px;border-left:3px solid #00c853}
.time{border:1.5px solid #00c853;border-radius:20px;padding:5px 0;color:#00c853;font-weight:900;font-size:13px;min-width:52px;text-align:center}
.teams{flex:1;margin-left:12px;line-height:18px;font-size:14px}
.score{color:#00ff66;font-weight:900;font-size:17px;min-width:50px;text-align:right}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore - Highlightly</span><a href="#" onclick="location.reload();return false;">↻ Refresh</a></div>
<div class="tabs" id="dateTabs"></div>
<div class="filter">
<button id="f-all" class="active" onclick="setFilter('all')">All Games</button>
<button id="f-live" onclick="setFilter('live')">Live</button>
<button id="f-fin" onclick="setFilter('finished')">Finished</button>
</div>
<div id="list" style="padding:20px;text-align:center">Loading Highlightly...</div>
<script>
let all=[],cur='all',curDate='';
const TOP_ORDER=[{k:'CHAMPIONS LEAGUE',p:1},{k:'EUROPA LEAGUE',p:2},{k:'PREMIER LEAGUE',p:4},{k:'LALIGA',p:5},{k:'LA LIGA',p:5},{k:'LIGUE 1',p:6},{k:'BUNDESLIGA',p:7},{k:'SERIE A',p:8},{k:'ARMENIA',p:11},{k:'ENGLAND',p:21},{k:'SPAIN',p:22}];
function getP(z,n){let f=(z+' '+n).toUpperCase();for(let t of TOP_ORDER) if(f.includes(t.k)) return t.p; return 80;}
function tabs(){
 let h='',t=new Date();let s=localStorage.getItem('lastDate')||new Date().toISOString().split('T')[0];
 for(let i=-4;i<=4;i++){let d=new Date(t);d.setDate(t.getDate()+i);let ds=d.toISOString().split('T')[0];
 let lb=i==-1?'Yesterday':i==0?'Today':i==1?'Tomorrow':d.toLocaleDateString('en',{month:'short',day:'numeric'});
 let ac=ds===s?'active':''; if(ac) curDate=ds;
 h+=`<button class="${ac}" onclick="goDate('${ds}',this)">${lb}</button>`}
 document.getElementById('dateTabs').innerHTML=h;
}
function goDate(ds,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');localStorage.setItem('lastDate',ds);load(ds);}
async function load(d){
 curDate=d; localStorage.setItem('lastDate',d);
 document.getElementById('list').innerHTML='Loading '+d+' from Highlightly...';
 try{
  let r=await fetch('/api/fixtures?date='+d+'&nocache=1');
  let j=await r.json();
  if(!j.success) throw new Error(j.error||'API error');
  all=j.data||[];
  if(!all.length) throw new Error('Highlightly returned 0 matches for '+d);
  show();
 }catch(e){
  document.getElementById('list').innerHTML='<div style="color:#ff3b30">Error: '+e.message+'<br><br>Check HIGHLIGHTLY_API_KEY in Cloudflare</div>';
  all=[];
 }
}
function setFilter(f){cur=f;document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));document.getElementById('f-'+(f=='finished'?'fin':f)).classList.add('active');show();}
function getTime(m){
 let st=(m.status||'').toUpperCase();
 if(['LIVE','HT','1H','2H'].includes(st)) return {t:(m.minute||'LIVE')+"'",c:'#ff3b30'};
 if(['FT','FINISHED'].includes(st)) return {t:'FT',c:'#00c853'};
 try{if(m.kickoff_utc) return {t:new Date(m.kickoff_utc).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}),c:'#00c853'};}catch(e){}
 return {t:'NS',c:'#00c853'};
}
function show(){
 let data=[...all];
 if(cur=='live') data=data.filter(x=>['LIVE','HT','1H','2H'].includes((x.status||'').toUpperCase()));
 if(cur=='finished') data=data.filter(x=>['FT','FINISHED'].includes((x.status||'').toUpperCase()));
 if(!data.length){document.getElementById('list').innerHTML='No matches '+cur+' for '+curDate;return}
 let g={}; data.forEach(m=>{let k=(m.league_zone||'WORLD')+' - '+m.league_name;if(!g[k]) g[k]={name:k,pri:getP(m.league_zone,m.league_name),games:[]};g[k].games.push(m);});
 let keys=Object.keys(g).sort((a,b)=>g[a].pri-g[b].pri);
 let html='<div style="color:#666;font-size:11px;padding:6px">Highlightly: '+data.length+' matches • '+keys.length+' leagues</div>';
 keys.forEach(k=>{
  let gr=g[k]; html+='<div class="league-head">'+gr.name+' ('+gr.games.length+')</div>';
  gr.games.forEach(x=>{
   let sc=(x.home_score!=null&&x.away_score!=null)?x.home_score+' - '+x.away_score:'- : -';
   let tm=getTime(x);
   html+='<div class="match"><div class="time" style="color:'+tm.c+';border-color:'+tm.c+'">'+tm.t+'</div><div class="teams"><div>'+x.home_team+'</div><div>'+x.away_team+'</div></div><div class="score">'+sc+'</div></div>';
  });
 });
 document.getElementById('list').innerHTML=html;
}
tabs(); load(localStorage.getItem('lastDate')||new Date().toISOString().split('T')[0]);
</script>
</body>
</html>
