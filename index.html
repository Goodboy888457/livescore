<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore - TOP LEAGUES FIRST</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;text-align:center;font-weight:bold;font-size:18px;color:#000;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;background:#121212;overflow-x:auto;white-space:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:#121212;color:#aaa;border:0;padding:12px 14px;white-space:nowrap;flex:1}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00ff66;background:#1a1a1a}
.filter{display:flex;gap:8px;padding:10px;background:#0f0f0f;overflow-x:auto}
.filter button{background:#222;color:#aaa;border:1px solid #333;padding:6px 14px;border-radius:20px;font-size:12px}
.filter button.active{background:#00ff66;color:#000;border-color:#00ff66;font-weight:bold}
.league-head{background:#00ff66;color:#000;padding:8px 12px;font-weight:900;margin-top:10px;font-size:13px;text-transform:uppercase;display:flex;justify-content:space-between}
.match{display:flex;align-items:center;padding:12px;border-radius:12px;margin:6px 8px;background:#151515;gap:12px;cursor:pointer}
.time-pill{border:2px solid #00ff66;border-radius:20px;padding:5px 12px;font-size:11px;min-width:60px;text-align:center;font-weight:700}
.teams{flex:1;line-height:20px;font-size:14px}
.score{color:#fff;font-weight:900;font-size:16px;text-align:right}
.refresh{color:#000;background:#fff;padding:4px 10px;border-radius:10px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore</span><span class="refresh" onclick="location.reload()">↻ Refresh</span></div>
<div class="tabs" id="dateTabs"></div>
<div class="filter">
<button id="f-all" class="active" onclick="setFilter('all')">All</button>
<button id="f-live" onclick="setFilter('live')">Live</button>
<button id="f-fin" onclick="setFilter('finished')">Finished</button>
<button id="f-top" onclick="setFilter('top')">Top Leagues Only</button>
</div>
<div id="list"><div style="padding:30px;text-align:center;color:#00ff66">Loading...</div></div>
<script>
let allData=[]; let curFilter='all';
const flags={"ENGLAND":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","SPAIN":"🇪🇸","FRANCE":"🇫🇷","GERMANY":"🇩🇪","ITALY":"🇮🇹","NETHERLANDS":"🇳🇱","PORTUGAL":"🇵🇹","EUROPE":"🏆","WORLD":"🌍"};
function getFlag(name){let u=(name||'').toUpperCase();for(let k in flags){if(u.includes(k)) return flags[k]}return '⚽';}
function isAsia(f){let u=f.toUpperCase();return u.includes("ASIA")||u.includes("AFC")||u.includes("JAPAN")||u.includes("KOREA")||u.includes("CHINA")||u.includes("THAILAND")||u.includes("SINGAPORE")||u.includes("MALAYSIA")||u.includes("INDONESIA");}
function getRank(full){
  let u=full.toUpperCase();
  if(isAsia(full)) return 9999;
  if(u.includes("CHAMPIONS LEAGUE")) return 0;
  if(u.includes("EUROPA LEAGUE")) return 1;
  if(u.includes("CONFERENCE LEAGUE")) return 2;
  if(u.includes("ENGLAND")&&u.includes("PREMIER LEAGUE")) return 3;
  if(u.includes("SPAIN")&&(u.includes("LALIGA")||u.includes("LA LIGA"))) return 4;
  if(u.includes("FRANCE")&&u.includes("LIGUE 1")) return 5;
  if(u.includes("GERMANY")&&u.includes("BUNDESLIGA")) return 6;
  if(u.includes("ITALY")&&u.includes("SERIE A")) return 7;
  return 100;
}
function buildDateTabs(){let h='';let today=new Date();for(let i=-2;i<=3;i++){let d=new Date(today);d.setDate(today.getDate()+i);let ds=d.toISOString().split('T')[0];let label=i==-1?'Yesterday':i==0?'Today':i==1?'Tomorrow':d.toLocaleDateString('en',{month:'short',day:'numeric'});let act=i==0?'active':'';h+=`<button class="${act}" onclick="selectDate('${ds}',this)">${label}</button>`;}document.getElementById('dateTabs').innerHTML=h;}
function selectDate(ds,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');load(ds);}
async function load(date){document.getElementById('list').innerHTML='<div style="padding:30px;text-align:center;color:#888">Loading '+date+'...</div>';try{const r=await fetch(`/api/fixtures?date=${date}`);const j=await r.json();allData=j.data||[];render();}catch(e){document.getElementById('list').innerHTML=`<div style="padding:20px;color:#ff5555">Error: ${e.message}</div>`;}}
function openMatch(id){let m=allData.find(x=>String(x.id)===String(id));if(m){localStorage.setItem('selected_match',JSON.stringify(m));}location.href='/match.html?id='+id;}
function setFilter(f){curFilter=f;document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));document.getElementById('f-'+(f=='finished'?'fin':f==='top'?'top':f))?.classList.add('active');render();}
function render(){
  let data=[...allData];
  if(curFilter=='live') data=data.filter(m=>m.status=='LIVE' || m.minute?.includes("'") || m.minute==='HT');
  if(curFilter=='finished') data=data.filter(m=>m.status=='FINISHED'||m.status=='FT');
  if(curFilter=='top') data=data.filter(m=>getRank(`${m.league_zone||''} - ${m.league_name||''}`)<100);
  if(!data.length){document.getElementById('list').innerHTML=`<div style="padding:30px;text-align:center;color:#666">No ${curFilter} games</div>`;return;}
  const groups={};
  data.forEach(m=>{let full=`${(m.league_zone||'World').toUpperCase()} - ${m.league_name||'League'}`;if(!groups[full]) groups[full]={display:full,games:[],rank:getRank(full)};groups[full].games.push(m);});
  let sorted=Object.keys(groups).sort((a,b)=>groups[a].rank-groups[b].rank||a.localeCompare(b));
  let topGroups=sorted.filter(k=>!isAsia(k));let asiaGroups=sorted.filter(k=>isAsia(k));sorted=[...topGroups,...asiaGroups];
  let html='';
  sorted.forEach(k=>{
    const g=groups[k];if(!g||!g.games.length) return;
    g.games.sort((a,b)=>(a.datetime||'').localeCompare(b.datetime||''));
    const flag=getFlag(g.display);const isAsiaGroup=isAsia(k);
    html+=`<div class="league-head" style="${isAsiaGroup?'background:#222;color:#666':''}"><span>${flag} ${g.display} (${g.games.length})</span><span>›</span></div>`;
    g.games.forEach(x=>{
      const tm=x.datetime?x.datetime.split(' ')[1]?.slice(0,5):'--:--';
      const isLive=x.status==='LIVE' || (x.minute && x.minute.includes("'"));
      const isHT=x.minute==='HT' || x.status==='HT';
      const isFT=x.status==='FINISHED'||x.status==='FT';
      let pillText=isLive? x.minute : isHT? 'HT' : isFT? 'FT' : tm;
      let pillStyle=isLive||isHT?'border-color:#ff3b30;color:#ff3b30;background:rgba(255,59,48,0.12)': isFT?'border-color:#00ff66;color:#00ff66;background:rgba(0,255,102,0.18)': 'border-color:#00ff66;color:#fff';
      let rightHTML=isLive||isHT?`<div class="score">${x.home_score} - ${x.away_score}</div>`: isFT?`<div class="score">${x.home_score} - ${x.away_score}</div>`: `<div class="score" style="color:#aaa">- : -</div>`;
      html+=`<div class="match" onclick="openMatch('${x.id}')"><div class="time-pill" style="${pillStyle}">${pillText}</div><div class="teams"><div>${x.home_team}</div><div>${x.away_team}</div></div><div style="text-align:right;min-width:60px">${rightHTML}</div></div>`;
    });
  });
  document.getElementById('list').innerHTML=html;
}
buildDateTabs();
load(new Date().toISOString().split('T')[0]);
</script>
</body>
</html>
