<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;text-align:center;font-weight:bold;font-size:18px;color:#000}
.tabs{display:flex;background:#121212;overflow-x:auto}
.tabs button{background:#121212;color:#aaa;border:0;padding:12px 16px;white-space:nowrap}
.tabs button.active{color:#00c853;border-bottom:3px solid #00c853}
.league-head{background:#1a1a1a;color:#00c853;padding:8px 12px;font-weight:bold;margin-top:10px;font-size:13px;text-transform:uppercase}
.match{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #222;background:#0f0f0f}
.match:hover{background:#1a1a1a}
.score{color:#00c853;font-weight:bold}
.status{font-size:11px;color:#888}
.live{color:#ff3b30;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="header">⚽ LiveScore</div>
<div class="tabs">
  <button onclick="load('2026-11-03')">Yesterday</button>
  <button class="active" onclick="loadToday()">Today</button>
  <button onclick="load('2026-11-05')">Tomorrow</button>
  <button onclick="loadLive()">Live</button>
</div>
<div id="list">Loading...</div>

<script>
async function load(date){
  document.getElementById('list').innerHTML='Loading...';
  const r=await fetch(`/api/fixtures?date=${date}`);
  const j=await r.json();
  render(j.data||[]);
}
function loadToday(){
  const d=new Date().toISOString().split('T')[0];
  load(d);
}
async function loadLive(){
  const r=await fetch(`/api/live`);
  const j=await r.json();
  render(j.data||[]);
}
function render(data){
  if(!data.length){document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center">No games</p>';return}
  // Group by country + league
  const groups={};
  data.forEach(m=>{
    const key=`${m.league_zone||m.league_geo||'World'}: ${m.league_name}`;
    if(!groups[key]) groups[key]=[];
    groups[key].push(m);
  });
  let html='';
  for(const league in groups){
    html+=`<div class="league-head">${league}</div>`;
    groups[league].forEach(match=>{
      const live = match.status==='LIVE' ? `<span class="live">● ${match.minute||'LIVE'}</span>` : `<span class="status">${match.status} ${match.minute||''}</span>`;
      html+=`<div class="match" onclick="location.href='/match.html?id=${match.id}'">
        <div><div>${match.home_team}</div><div>${match.away_team}</div></div>
        <div style="text-align:right"><div class="score">${match.home_score!=null?match.home_score+' - '+match.away_score:'-:-'}</div><div>${live}</div></div>
      </div>`;
    });
  }
  document.getElementById('list').innerHTML=html;
}
loadToday();
</script>
</body>
</html>
