<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kingdom Livescore 2026/27 - REAL LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f1419;color:#fff}
header{background:#1a2530;padding:12px 15px;display:flex;justify-content:space-between;border-bottom:2px solid #00c853;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:20px;color:#00c853}.logo span{color:#fff}
.live-dot{background:#ff3b30;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tabs{display:flex;background:#131d27;border-bottom:1px solid #1e2e3e;position:sticky;top:52px;z-index:10}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{border-bottom:2px solid #00c853;color:#00c853;background:#1a2530}
.search{background:#131d27;padding:10px 15px}
.search input{width:100%;padding:10px;border-radius:20px;border:1px solid #2a3a4a;background:#1e2e3e;color:#fff;outline:none}
.verse{background:#00c853;color:#000;padding:6px 15px;text-align:center;font-size:11px;font-weight:700}
.league{background:#1e2e3e;padding:10px 15px;font-weight:700;font-size:13px;border-top:1px solid #2a3a4a;display:flex;justify-content:space-between}
.match{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid #1e2e3e;font-size:14px;cursor:pointer;background:#131d27}
.match:hover{background:#1a2530}.match.live{border-left:3px solid #ff3b30}
.time{width:55px;font-size:12px;color:#00c853;font-weight:700}
.teams{flex:1}.team{display:flex;justify-content:space-between;padding:1px 0}
.score{font-weight:700;background:#2a3a4a;padding:1px 6px;border-radius:3px;min-width:24px;text-align:center}
.status{width:40px;text-align:right;font-size:11px;color:#ff3b30}
.loading{text-align:center;padding:40px;color:#8b9bb4;line-height:1.6}
.refresh{position:fixed;bottom:20px;right:20px;background:#00c853;color:#000;width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:20px}
#modalBox{background:#1a2530;width:100%;max-width:400px;border-radius:12px;overflow:hidden;border:1px solid #2a3a4a}
.modalHead{background:#1e2e3e;padding:12px 15px;display:flex;justify-content:space-between;font-weight:700}
.closeBtn{cursor:pointer;background:#ff3b30;padding:2px 8px;border-radius:4px}
.modalBody{padding:15px;font-size:13px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3a4a}
</style>
</head>
<body>
<header><div class="logo">KINGDOM <span>2026/27</span></div><div class="live-dot" id="count">● REAL LIVE</div></header>
<div class="verse">📖 2026/27 Season - Seek ye first the Kingdom - Matt 6:33</div>
<div class="tabs">
<div class="tab active" onclick="switchTab('live',this)">LIVE</div>
<div class="tab" onclick="switchTab('today',this)">TODAY</div>
<div class="tab" onclick="switchTab('finished',this)">FT</div>
<div class="tab" onclick="openTable()">TABLE</div>
</div>
<div class="search"><input id="search" placeholder="🔍 Search team, league..." onkeyup="searchTeam()"></div>
<div id="content"><div class="loading">⏳ Loading REAL LIVE HIGH...</div></div>
<div class="refresh" onclick="load()">↻</div>
<div id="modal" onclick="closeModal()"><div id="modalBox" onclick="event.stopPropagation()"><div class="modalHead"><span id="mTitle">Match</span><span class="closeBtn" onclick="closeModal()">X</span></div><div class="modalBody" id="mBody"></div></div></div>
<script>
let current='live';
async function load(){
 let c=document.getElementById('content');
 c.innerHTML='<div class=loading>⏳ Loading '+current.toUpperCase()+'...</div>';
 try{
  let r=await fetch('/api/live?type='+current);
  let d=await r.json();
  // HIGH ONLY format can be array or object with data/matches/response
  let f = d.response || d.data || d.matches || d || [];
  if(!Array.isArray(f)) f = f.response || f.data || [];
  
  // Filter based on tab for Highlightly state.description
  let filtered = f;
  if(f.length>0 && f[0].state){
    if(current==='live') filtered = f.filter(m=>['First half','Second half','Halftime','Extra time','First half extra','Second half extra'].includes(m.state.description));
    if(current==='finished') filtered = f.filter(m=>m.state.description==='Finished');
  }
  
  if(filtered.length==0 && current==='live'){
    // If no live, show today count but message
    if(f.length>0){
      document.getElementById('count').innerText='● '+f.length+' TODAY';
      render(f); return;
    }
    c.innerHTML='<div class=loading>✅ No games for LIVE now<br>Try TODAY tab<br><br>2026/27 season starts August 2026</div>';return
  }
  if(filtered.length==0){c.innerHTML='<div class=loading>✅ No games for '+current.toUpperCase()+' now<br>Try TODAY tab</div>';return}
  
  document.getElementById('count').innerText='● '+filtered.length+' '+current.toUpperCase();
  render(filtered)
 }catch(e){c.innerHTML='<div class=loading>Error: '+e.message+'<br>Wait 1 min & refresh</div>'}
}
function render(fixtures){
 // Support BOTH API-FOOTBALL and HIGHLIGHTLY formats
 let groups={};
 fixtures.forEach(x=>{
  let leagueName = x.league?.name || x.competition?.name || 'Football';
  let country = x.league?.country || '';
  let key = leagueName + (country?' - '+country:'');
  if(!groups[key]) groups[key]=[];
  groups[key].push(x)
 });
 let h='';
 for(let k in groups){
  h+=`<div class="league"><span>${k}</span><span>${groups[k].length}</span></div>`;
  groups[k].forEach(f=>{
   // HIGH format: homeTeam, awayTeam, state
   // OLD format: teams.home, fixture.status
   let isHighlightly = !!f.state;
   let home = isHighlightly ? (f.homeTeam?.name || f.homeTeam || 'Home') : f.teams.home.name;
   let away = isHighlightly ? (f.awayTeam?.name || f.awayTeam || 'Away') : f.teams.away.name;
   let homeScore = isHighlightly ? (f.state?.score?.home ?? f.state?.score?.current?.home ?? 0) : (f.goals.home ?? 0);
   let awayScore = isHighlightly ? (f.state?.score?.away ?? f.state?.score?.current?.away ?? 0) : (f.goals.away ?? 0);
   let time = isHighlightly ? (f.state?.clock || f.state?.description || 'NS') : (f.fixture.status.elapsed ? f.fixture.status.elapsed+"'" : f.fixture.status.short);
   let short = isHighlightly ? f.state.description : f.fixture.status.short;
   let isLive = isHighlightly ? ['First half','Second half','Halftime'].includes(f.state.description) : ['1H','2H','HT','LIVE'].includes(f.fixture.status.short);
   
   h+=`<div class="match ${isLive?'live':''}" onclick="openMatch('${home} vs ${away}','${time}','${homeScore}-${awayScore}','${k}')"><div class="time">${time}</div><div class="teams"><div class="team"><span>${home}</span><span class="score">${homeScore}</span></div><div class="team"><span>${away}</span><span class="score">${awayScore}</span></div></div><div class="status">${short.substring(0,4)}</div></div>`
  })
 }
 document.getElementById('content').innerHTML=h;
}
function switchTab(t,el){current=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');load()}
function openMatch(ti,time,sc,info){document.getElementById('mTitle').innerText=ti;document.getElementById('mBody').innerHTML=`<div class=stat><span>Score</span><b>${sc}</b></div><div class=stat><span>Time</span><span>${time}</span></div><div class=stat><span>League</span><span>${info}</span></div><br><button onclick="closeModal()" style="width:100%;padding:12px;background:#00c853;border:none;border-radius:8px;font-weight:700">Close</button>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function searchTeam(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.match').forEach(m=>{m.style.display=m.innerText.toLowerCase().includes(q)?'flex':'none'})}
async function openTable(){alert("TABLE for HIGH ONLY coming soon - Highlightly uses /football/standings endpoint. For now use Live/Today/FT tabs!")}
load();setInterval(load,
