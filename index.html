<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kingdom Livescore</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#0f1419;color:#fff}header{background:#1a2530;padding:12px 15px;display:flex;justify-content:space-between;border-bottom:2px solid #00c853;position:sticky;top:0;z-index:20}.logo{font-weight:900;font-size:22px;color:#00c853}.logo span{color:#fff}.live-dot{background:#ff3b30;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}.search{background:#131d27;padding:10px 15px}.search input{width:100%;padding:10px;border-radius:20px;border:1px solid #2a3a4a;background:#1e2e3e;color:#fff;outline:none}.verse{background:#00c853;color:#000;padding:8px 15px;text-align:center;font-size:12px;font-weight:700}.league{background:#1e2e3e;padding:10px 15px;font-weight:700;font-size:14px;border-top:1px solid #2a3a4a;display:flex;justify-content:space-between;cursor:pointer}.match{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid #1e2e3e;font-size:14px;cursor:pointer;background:#131d27}.match:hover{background:#1a2530}.time{width:55px;font-size:12px;color:#00c853;font-weight:700}.teams{flex:1}.team{display:flex;justify-content:space-between;padding:2px 0}.score{font-weight:700;background:#2a3a4a;padding:1px 6px;border-radius:3px;min-width:24px;text-align:center}.status{width:40px;text-align:right;font-size:11px;color:#ff3b30}.loading{text-align:center;padding:40px;color:#8b9bb4}#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:20px}#modalBox{background:#1a2530;width:100%;max-width:400px;border-radius:12px;overflow:hidden;border:1px solid #2a3a4a}.modalHead{background:#1e2e3e;padding:12px 15px;display:flex;justify-content:space-between;font-weight:700}.closeBtn{cursor:pointer;background:#ff3b30;padding:2px 8px;border-radius:4px}.modalBody{padding:15px;font-size:13px}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3a4a}</style></head><body><header><div class="logo">KINGDOM <span>LIVESCORE</span></div><div class="live-dot">● REAL LIVE</div></header><div class="verse">📖 Seek ye first the Kingdom - Matt 6:33</div><div class="search"><input id="search" placeholder="🔍 Search team..." onkeyup="searchTeam()"></div><div id="content"><div class="loading">⏳ Loading REAL LIVE...</div></div><div id="modal" onclick="closeModal()"><div id="modalBox" onclick="event.stopPropagation()"><div class="modalHead"><span id="mTitle">Match</span><span class="closeBtn" onclick="closeModal()">X</span></div><div class="modalBody" id="mBody"></div></div></div><script>async function load(){try{let r=await fetch('/api/live');let d=await r.json();let f=d.response||[];if(f.length==0){document.getElementById('content').innerHTML='<div class=loading>✅ API Working! No LIVE match right now. Check later.</div>';return;}render(f)}catch(e){document.getElementById('content').innerHTML='<div class=loading>Deploying... wait 1 min then refresh<br>'+e.message+'</div>'}}function render(fixtures){let c=document.getElementById('content');let l={};fixtures.forEach(x=>{let n=x.league.name+' - '+x.league.country;if(!l[n])l[n]=[];l[n].push(x)});let h='';for(let k in l){h+=`<div class="league">${k} (${l[k].length}) <span>▼</span></div><div>`;l[k].forEach(f=>{let t=f.fixture.status.elapsed?f.fixture.status.elapsed+"'":f.fixture.status.short;h+=`<div class="match" onclick="openMatch('${f.teams.home.name} vs ${f.teams.away.name}','${t}','${f.goals.home??0}-${f.goals.away??0}','${k}')"><div class="time">${t}</div><div class="teams"><div class="team"><span>${f.teams.home.name}</span><span class="score">${f.goals.home??0}</span></div><div class="team"><span>${f.teams.away.name}</span><span class="score">${f.goals.away??0}</span></div></div><div class="status">${f.fixture.status.short}</div></div>`});h+='</div>'}c.innerHTML=h}function openMatch(ti,time,sc,info){document.getElementById('mTitle').innerText=ti;document.getElementById('mBody').innerHTML=`<div class=stat><span>Score</span><b>${sc}</b></div><div class=stat><span>Time</span><span>${time}</span></div><div class=stat><span>League</span><span>${info}</span></div><br><button onclick="closeModal()" style="width:100%;padding:12px;background:#00c853;border:none;border-radius:8px;font-weight:700">Close - Clickable ✓</button>`;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function searchTeam(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.match').forEach(m=>{m.style.display=m.innerText.toLowerCase().includes(q)?'flex':'none'})}load();</script></body></html>
