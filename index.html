<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Details</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#000;font-weight:900}
.header a{background:#fff;color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700}
.scorebox{background:#151515;padding:24px;text-align:center;border-bottom:3px solid #00ff66}
.teams{font-size:22px;font-weight:900;line-height:30px}
.score{font-size:50px;color:#00ff66;font-weight:900;margin:12px 0}
.tabs{display:flex;background:#121212}
.tabs button{flex:1;background:#121212;color:#aaa;border:0;padding:15px 5px;font-weight:900}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00ff66;background:#1a1a1a}
.content{padding:12px}
.card{background:#151515;border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:14px}
.row.head{color:#00ff66;font-weight:900;background:#1f1f1f;border-radius:10px}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore</span><a href="/">← Back</a></div>
<div id="top" class="scorebox">Loading...</div>
<div class="tabs">
<button class="active" onclick="switchTab('details',this)">DETAILS</button>
<button onclick="switchTab('stats',this)">STATS</button>
<button onclick="switchTab('table',this)">TABLE</button>
<button onclick="switchTab('h2h',this)">H2H</button>
</div>
<div id="details" class="content"></div>
<div id="stats" class="content" style="display:none"></div>
<div id="table" class="content" style="display:none"></div>
<div id="h2h" class="content" style="display:none"></div>
<script>
function switchTab(n,el){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.content').forEach(c=>c.style.display='none');
  document.getElementById(n).style.display='block';
}
function load(){
  let raw = localStorage.getItem('selected_match');
  if(!raw){
    document.getElementById('top').innerHTML = "No match saved. Go back and click a match again.";
    return;
  }
  let m = JSON.parse(raw);
  let home = m.home_team || m.home || "Home";
  let away = m.away_team || m.away || "Away";
  let league = m.league_name || "League";
  let zone = m.league_zone || m.league_geo || "";
  let hScore = m.home_score ?? "-";
  let aScore = m.away_score ?? "-";
  let status = m.status || "Scheduled";
  let minute = m.minute || "";
  let datetime = m.datetime || "";

  document.getElementById('top').innerHTML = `<div style="color:#888;font-size:12px">🏆 ${zone} - ${league}</div><div class="teams">${home}<br><span style="color:#666">vs</span><br>${away}</div><div class="score">${hScore} - ${aScore}</div><div style="color:${status=='LIVE'?'#ff3b30':'#aaa'};font-weight:900">${status} ${minute}</div><div style="color:#666;font-size:11px;margin-top:10px">${datetime}</div>`;
  document.getElementById('details').innerHTML = `<div class="card"><div class="row head"><span>MATCH INFORMATION</span></div><div class="row"><span>League</span><span>${league}</span></div><div class="row"><span>Zone</span><span>${zone}</span></div><div class="row"><span>Date & Time</span><span>${datetime}</span></div><div class="row"><span>Status</span><span>${status} ${minute}</span></div><div class="row"><span>Home Team</span><span>${home}</span></div><div class="row"><span>Away Team</span><span>${away}</span></div><div class="row"><span>Score</span><span>${hScore} - ${aScore}</span></div></div>`;
  document.getElementById('stats').innerHTML = `<div class="card"><div class="row head"><span>STATS - ${home} vs ${away}</span></div><div class="row"><span>Possession</span><span>50% - 50%</span></div></div>`;
  document.getElementById('table').innerHTML = `<div class="card"><div class="row head"><span>${league} TABLE</span></div></div>`;
  document.getElementById('h2h').innerHTML = `<div class="card"><div class="row head"><span>H2H ${home} vs ${away}</span></div></div>`;
}
load();
</script>
</body>
</html>
