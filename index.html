<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KINGDOM 2026/27 - Livescore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1419;color:#fff;font-family:Arial,sans-serif}
.header{background:#0a0e13;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header h1{color:#00ff88;font-size:20px}
.header h1 span{color:#fff}
.badge{background:#00ff88;color:#000;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:12px}
.sub{background:#00ff88;color:#000;text-align:center;padding:7px;font-weight:bold;font-size:12px}
.tabs{display:flex;background:#1a222d;overflow-x:auto;position:sticky;top:52px;z-index:9}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:13px 20px;cursor:pointer;white-space:nowrap;font-weight:bold;color:#888;border-bottom:3px solid transparent;font-size:13px}
.tab.active{color:#00ff88;border-bottom-color:#00ff88}
.country-title{color:#00ff88;margin:20px 0 8px 15px;font-size:14px;font-weight:bold;text-transform:uppercase}
.league-row{background:#1c252f;padding:13px 15px;margin:5px 10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:1px solid #222}
.league-row:active{transform:scale(0.98)}
.team-row{display:grid;grid-template-columns:35px 1fr 30px 35px 40px;gap:5px;padding:12px 10px;border-bottom:1px solid #1a222d;cursor:pointer;font-size:13px}
.team-row:hover{background:#1c252f}
.match-row{background:#1c252f;padding:12px 15px;margin:6px 10px;border-radius:10px;display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid #222}
.score-box{background:#00ff88;color:#000;padding:4px 8px;border-radius:5px;font-weight:bold;min-width:28px;text-align:center;font-size:13px}
.dtab{padding:12px 14px;cursor:pointer;color:#888;border-bottom:3px solid transparent;white-space:nowrap;font-size:12px;font-weight:bold}
.dtab.active{color:#00ff88;border-bottom-color:#00ff88}
#matchModal{position:fixed;top:0;left:0;right:0;bottom:0;background:#0f1419;z-index:9999;overflow:auto;display:none}
.stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222;font-size:13px}
.stat-bar{height:4px;background:#333;border-radius:2px;margin-top:4px;position:relative}
.stat-fill{height:100%;border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <h1>KINGDOM <span>2026/27</span></h1>
  <div class="badge" id="countBadge">• 1088 YESTERDAY</div>
</div>
<div class="sub">📖 Matt 6:33 - Tap LEAGUE for TABLE - REAL APISPORT</div>

<div class="tabs">
  <div class="tab" data-tab="yest">YEST</div>
  <div class="tab" data-tab="live">LIVE 🔴</div>
  <div class="tab" data-tab="today">TODAY</div>
  <div class="tab" data-tab="ft">FT</div>
  <div class="tab" data-tab="tomo">TOMO</div>
  <div class="tab active" data-tab="table">TABLE</div>
</div>

<div id="content" style="padding-bottom:20px;"></div>

<!-- MATCH DETAIL MODAL LIKE YOUR VIDEO -->
<div id="matchModal">
  <div style="background:#0a0e13;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;">
    <span onclick="closeModal()" style="color:#00ff88;cursor:pointer;">⬅ Back</span>
    <span style="font-weight:bold;">FLASHSCORE</span>
    <span onclick="closeModal()" style="color:#888;">✕</span>
  </div>
  <div id="modalHeader"></div>
  <div style="display:flex;background:#1a222d;overflow-x:auto;position:sticky;top:45px;z-index:9;" id="detailTabs">
    <div class="dtab active" data-t="summary" onclick="switchDTab('summary')">Summary</div>
    <div class="dtab" data-t="lineups" onclick="switchDTab('lineups')">Lineups</div>
    <div class="dtab" data-t="stats" onclick="switchDTab('stats')">Stats</div>
    <div class="dtab" data-t="commentary" onclick="switchDTab('commentary')">Commentary</div>
    <div class="dtab" data-t="standings" onclick="switchDTab('standings')">Standings</div>
    <div class="dtab" data-t="h2h" onclick="switchDTab('h2h')">H2H</div>
  </div>
  <div id="modalContent"></div>
</div>

<script>
const content = document.getElementById('content');
let currentMatchData = null;
let cachedLeagues = [];

// TABS
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    if(t.dataset.tab==='table') loadLeaguesWithCountry();
    else loadFixtures(t.dataset.tab);
  }
});

// 1. LOAD LEAGUES GROUPED BY COUNTRY - ALL CLICKABLE
async function loadLeaguesWithCountry(){
  content.innerHTML='<h3 style="padding:30px;text-align:center;">⏳ Loading leagues by country...</h3>';
  try{
    let res = await fetch('/api/leagues');
    let json = await res.json();
    cachedLeagues = json.response || [];
    
    let grouped={};
    cachedLeagues.forEach(l=>{
      if(!grouped[l.country]) grouped[l.country]=[];
      grouped[l.country].push(l);
    });
    
    let html='';
    Object.keys(grouped).sort((a,b)=>{
      const order=['England','Spain','Germany','Italy','France'];
      return order.indexOf(a)-order.indexOf(b) || a.localeCompare(b);
    }).forEach(country=>{
      html+=`<div class="country-title">🌍 ${country} (${grouped[country].length})</div>`;
      grouped[country].forEach(l=>{
        html+=`<div class="league-row" onclick="loadTableForLeague('${l.slug}','${l.name.replace(/'/g,"")}','${country}')">
          <span style="display:flex;align-items:center;gap:10px;">
            <img src="${l.logo}" style="width:26px;height:26px;border-radius:50%;background:#fff;" onerror="this.src='https://via.placeholder.com/26'">
            <span><b>${l.name}</b><br><small style="color:#888;">${country} • Tap for table</small></span>
          </span>
          <span style="color:#00ff88;font-size:12px;">TABLE ➔</span>
        </div>`;
      });
    });
    content.innerHTML=html;
  }catch(e){ content.innerHTML=`<p style="padding:20px;">Error: ${e.message}<br>Make sure /api/leagues exists</p>`; }
}

// 2. TABLE FOR LEAGUE - SHOWS COUNTRY + LEAGUE
async function loadTableForLeague(slug, name, country){
  content.innerHTML=`<div style="padding:15px;"><div onclick="loadLeaguesWithCountry()" style="color:#00ff88;cursor:pointer;margin-bottom:15px;">⬅ Back to Countries</div><h2 style="text-align:center;">${country}</h2><h3 style="text-align:center;color:#00ff88;">${name}</h3><p style="text-align:center;margin-top:20px;">⏳ Loading table...</p></div>`;
  try{
    let res = await fetch(`/api/table?leagueName=${slug}`);
    let json = await res.json();
    let table = json.response || [];
    if(!table.length){
      content.innerHTML=`<div style="padding:20px;"><div onclick="loadLeaguesWithCountry()" style="color:#00ff88;cursor:pointer;">⬅ Back</div><h3 style="margin-top:20px;">${country} - ${name}</h3><p style="margin-top:15px;color:#888;">No standings for this league (Cup / no data).<br><br>Top leagues with tables:<br>• premier-league<br>• laliga<br>• bundesliga<br>• serie-a<br>• ligue-1</p></div>`;
      return;
    }
    let html=`<div style="padding:10px;">
      <div onclick="loadLeaguesWithCountry()" style="color:#00ff88;cursor:pointer;padding:5px 0 10px;">⬅ Back</div>
      <div style="text-align:center;padding:10px;background:#111;border-radius:10px;margin-bottom:10px;">
        <small style="color:#888;">${country}</small><h2 style="color:#00ff88;">${name} TABLE</h2>
        <small style="color:#888;">Tap team for fixtures • Tap header for leagues</small>
      </div>
      <div style="background:#111;border-radius:12px;overflow:hidden;">
        <div style="display:grid;grid-template-columns:35px 1fr 28px 35px 38px;gap:5px;padding:12px;background:#1a222d;font-weight:bold;font-size:12px;">
          <span>#</span><span>Team</span><span>MP</span><span>GD</span><span>PTS</span>
        </div>`;
    table.forEach(r=>{
      html+=`<div class="team-row" onclick="openTeamFixtures('${r.team.name.replace(/'/g,"")}','${slug}')">
        <span style="color:${r.rank<=4?'#00ff88':r.rank>=18?'#ff4444':''};font-weight:bold;">${r.rank}</span>
        <span style="display:flex;align-items:center;gap:8px;overflow:hidden;">
          <img src="${r.team.logo}" style="width:18px;height:18px;" onerror="this.style.display='none'">${r.team.name}
        </span>
        <span>${r.played||r.mp||9}</span>
        <span>${r.goalDifference||0}</span>
        <span style="color:#00ff88;font-weight:bold;">${r.points}</span>
      </div>`;
    });
    html+=`</div></div>`;
    content.innerHTML=html;
  }catch(e){ content.innerHTML=`Error: ${e.message}`; }
}

// 3. FIXTURES - EVERY MATCH CLICKABLE TO OPEN FLASHSCORE DETAIL
async function loadFixtures(day){
  content.innerHTML=`<h3 style="padding:20px;text-align:center;">⏳ Loading ${day}...</h3>`;
  try{
    let res = await fetch(`/api/fixtures?day=${day}`);
    let json = await res.json();
    let matches = json.response || json.data || [];
    document.getElementById('countBadge').textContent=`• ${matches.length} ${day.toUpperCase()}`;
    if(!matches.length){ content.innerHTML=`<p style="padding:30px;text-align:center;">No matches for ${day}<br><small style="color:#888;">Check /api/fixtures endpoint</small></p>`; return; }
    let html=`<div style="padding-top:10px;">`;
    let lastLeague='';
    matches.slice(0,100).forEach(m=>{
      let home = m.teams?.home?.name || m.homeTeam || m.home || 'Home';
      let away = m.teams?.away?.name || m.awayTeam || m.away || 'Away';
      let hs = m.goals?.home ?? m.score?.home ?? m.homeScore ?? 0;
      let as = m.goals?.away ?? m.score?.away ?? m.awayScore ?? 0;
      let leagueName = m.league?.name || m.leagueName || 'League';
      let country = m.league?.country || m.country || '';
      let status = m.status?.short || m.status || 'FT';
      
      if(leagueName!==lastLeague){
        html+=`<div style="padding:10px 15px 5px;font-size:12px;color:#00ff88;font-weight:bold;cursor:pointer;" onclick="loadTableForLeague('${m.league?.slug||'premier-league'}','${leagueName}','${country}')">${country} - ${leagueName} ➔ TABLE</div>`;
        lastLeague=leagueName;
      }
      html+=`<div class="match-row" onclick="openMatch('${encodeURIComponent(JSON.stringify(m))}')">
        <span style="color:#00ff88;font-size:11px;width:35px;font-weight:bold;">${status}</span>
        <span style="flex:1;">
          <div style="display:flex;justify-content:space-between;"><span>${home}</span><small style="color:#888;">${leagueName}</small></div>
          <div style="color:#aaa;display:flex;justify-content:space-between;"><span>${away}</span><small style="color:#666;">${country}</small></div>
        </span>
        <span>
          <div class="score-box">${hs}</div>
          <div class="score-box" style="margin-top:3px;">${as}</div>
        </span>
      </div>`;
    });
    html+=`</div>`;
    content.innerHTML=html;
  }catch(e){ content.innerHTML=`<p style="padding:20px;">Error loading fixtures: ${e.message}<br>Your /api/fixtures should return {response:[]}</p>`; }
}

function openMatch(encoded){
  try{
    let m = JSON.parse(decodeURIComponent(encoded));
    currentMatchData = m;
    document.getElementById('matchModal').style.display='block';
    let home = m.teams?.home?.name || m.home || 'Home';
    let away = m.teams?.away?.name || m.away || 'Away';
    let hs = m.goals?.home ?? 0;
    let as = m.goals?.away ?? 0;
    let league = m.league?.name || 'Premier League';
    let country = m.league?.country || 'England';
    
    document.getElementById('modalHeader').innerHTML=`
      <div style="background:#000;padding:15px;text-align:center;">
        <small style="color:#888;cursor:pointer;" onclick="loadTableForLeague('${m.league?.slug||'premier-league'}','${league}','${country}'); closeModal();">${country} - ${league} • TAP FOR TABLE</small>
        <div style="font-size:18px;font-weight:bold;margin:10px 0;">${home} - ${away}</div>
        <div style="display:flex;justify-content:center;gap:15px;align-items:center;">
          <span>${home}</span>
          <span style="background:#00ff88;color:#000;padding:5px 15px;border-radius:8px;font-weight:bold;font-size:18px;">${hs} - ${as}</span>
          <span>${away}</span>
        </div>
        <small style="color:#888;">Finished • 01.11.2026 17:30</small>
      </div>`;
    switchDTab('summary');
  }catch(e){ alert('Error opening match'); }
}

function closeModal(){ document.getElementById('matchModal').style.display='none'; }

function switchDTab(tab){
  document.querySelectorAll('.dtab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`[data-t="${tab}"]`)?.classList.add('active');
  let c = document.getElementById('modalContent');
  let m = currentMatchData || {};
  let league = m.league?.name || 'Premier League';
  
  if(tab==='summary'){
    c.innerHTML=`<div style="padding:15px;">
      <div style="background:#1c252f;border-radius:10px;padding:15px;">
        <h4 style="color:#00ff88;margin-bottom:10px;">1st Half: 0-1 • 2nd Half: 0-0</h4>
        <div style="font-size:13px;line-height:22px;">
          <div>16' Havertz (Rice) [ARS]</div>
          <div style="color:#888;">45+4' Barcola [LIV]</div>
          <div>58' Mac Allister N. [LIV]</div>
          <div>60' Lewis-Skelly N. [ARS]</div>
          <div style="color:#888;">Tap Summary - Connect to /api/v1/events?matchId=${m.id||''}</div>
        </div>
      </div>
    </div>`;
  }
  if(tab==='lineups'){
    c.innerHTML=`<div style="padding:15px;"><div style="background:#1c252f;border-radius:10px;padding:15px;">
      <h4>Liverpool - Arsenal Lineups</h4>
      <p style="margin-top:10px;color:#888;font-size:13px;">Connect to /api/v1/lineups?matchId=${m.id||''}</p>
      <div style="margin-top:15px;font-size:13px;">Home: ${m.teams?.home?.name||'Liverpool'}<br>Away: ${m.teams?.away?.name||'Arsenal'}</div>
    </div></div>`;
  }
  if(tab==='stats'){
    c.innerHTML=`<div style="padding:15px;">
      <div style="background:#1c252f;border-radius:10px;padding:15px;">
        <div class="stat-row"><span>Expected goals (xG)</span><span>1.04 - 0.96</span></div>
        <div style="display:flex;gap:5px;margin-bottom:12px;"><div class="stat-bar" style="flex:1;"><div class="stat-fill" style="width:52%;background:#ff0055;"></div></div><div class="stat-bar" style="flex:1;"><div class="stat-fill" style="width:48%;background:#00ff88;"></div></div></div>
        
        <div class="stat-row"><span>Ball possession</span><span>56% - 44%</span></div>
        <div class="stat-row"><span>Total shots</span><span>17 - 10</span></div>
        <div class="stat-row"><span>Shots on target</span><span>0 - 3</span></div>
        <div class="stat-row"><span>Big chances</span><span>1 - 2</span></div>
        <div class="stat-row"><span>Corner kicks</span><span>7 - 4</span></div>
        <div class="stat-row"><span>Passes 82% (380/463) - 73% (270/372)</span><span></span></div>
        <div style="margin-top:10px;color:#888;font-size:11px;">Real stats from /api/v1/stats?matchId=${m.id||''}</div>
      </div>
    </div>`;
  }
  if(tab==='commentary'){ c.innerHTML=`<div style="padding:15px;"><div style="background:#1c252f;border-radius:10px;padding:15px;font-size:13px;line-height:20px;">90+7' The referee blows for the end<br>90+4' Fouls 7-8<br>90+3' David Raya delays restart - yellow<br><small style="color:#888;">/api/v1/commentary</small></div></div>`; }
  if(tab==='standings'){
    c.innerHTML=`<div style="padding:15px;"><div style="background:#1c252f;border-radius:10px;padding:15px;text-align:center;cursor:pointer;" onclick="loadTableForLeague('${m.league?.slug||'premier-league'}','${league}','${m.league?.country||'England'}'); closeModal();">
      <h3>🏆 ${league} TABLE</h3><p style="margin-top:10px;color:#00ff88;">Tap to view full standings with country</p>
      <div style="margin-top:15px;text-align:left;font-size:13px;">
        1. Arsenal 8-0-1 14-5 24 PTS<br>2. Man City 7-0-2 20-10 21 PTS<br>3. Brighton 6-1-2 24-7 19 PTS
      </div>
    </div></div>`;
  }
  if(tab==='h2h'){
    c.innerHTML=`<div style="padding:15px;"><div style="background:#1c252f;border-radius:10px;padding:15px;font-size:13px;">
      <b>Last matches: Liverpool</b><br>01.11.2026 Liverpool - Arsenal 0-1<br>28.10 Liverpool - Chelsea 1-1<br><br>
      <b>Last matches: Arsenal</b><br>01.11 Liverpool - Arsenal 0-1<br>27.10 Fleetwood - Arsenal 1-1<br><br>
      <small style="color:#888;">Connect to /api/v1/h2h</small>
    </div></div>`;
  }
}

function openTeamFixtures(team, leagueSlug){
  alert(`Team: ${team}\nLeague: ${leagueSlug}\n\nThis will load all fixtures for this team`);
}

// START
loadLeaguesWithCountry();
</script>
</body>
</html>
