<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore</title>
<style>
body{font-family:Arial;background:#0b1220;color:white;margin:0;padding:10px}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:12px;text-align:center;background:#1a2744;border-radius:10px;cursor:pointer;font-weight:bold;white-space:pre-line}
.tab.active{background:#00e5a0;color:#000}
.match{background:#151f35;padding:12px;margin-bottom:8px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.league{font-size:12px;color:#8aa0c0;margin:15px 0 5px 0}
.score{color:#00e5a0;font-weight:bold}
</style>
</head>
<body>
<h2 style="text-align:center">⚽ LiveScore</h2>
<div class="tabs">
  <div class="tab" id="y"></div>
  <div class="tab active" id="t"></div>
  <div class="tab" id="tm"></div>
</div>
<div id="results" style="margin-top:15px">Loading...</div>
<script>
function fmt(d){return d.toISOString().split('T')[0];}
const today=new Date();const yd=new Date();yd.setDate(today.getDate()-1);const td=new Date();td.setDate(today.getDate()+1);
const D={y:fmt(yd),t:fmt(today),tm:fmt(td)};
document.getElementById('y').innerText=`Yesterday\n${D.y}`;document.getElementById('t').innerText=`Today\n${D.t}`;document.getElementById('tm').innerText=`Tomorrow\n${D.tm}`;
document.getElementById('y').onclick=e=>load(D.y,e.target);document.getElementById('t').onclick=e=>load(D.t,e.target);document.getElementById('tm').onclick=e=>load(D.tm,e.target);

async function load(date, el){
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');
 const box=document.getElementById('results');box.innerHTML="Loading "+date+"...";
 try{
  const r=await fetch(`/api/fixtures?date=${date}`);const j=await r.json();
  console.log(j);
  const list=j.data||[];
  if(list.length===0){box.innerHTML="No matches for "+date;return;}
  let h=""; let lastLeague="";
  list.forEach(m=>{
    if(m.league_name!==lastLeague){ h+=`<div class="league">${m.league_name}</div>`; lastLeague=m.league_name; }
    const score = (m.status==="Scheduled" || m.home_score===null) ? `${m.status} ${m.minute||''} vs` : `${m.home_score}-${m.away_score} ${m.minute||m.status}`;
    h+=`<div class="match"><span>${m.home_team} vs ${m.away_team}</span><span class="score">${score}</span></div>`;
  });
  box.innerHTML=h;
 }catch(err){box.innerHTML="Error: "+err.message;}
}
load(D.t, document.getElementById('t'));
</script>
</body>
</html>
