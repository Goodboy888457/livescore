<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KINGDOM 26/27</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}.top{padding:12px;background:#000;border-bottom:2px solid #0f0;display:flex;justify-content:space-between}.d-bar{display:flex;overflow:auto;background:#111;border-bottom:2px solid #0f0;position:sticky;top:0}.d{padding:12px;min-width:70px;text-align:center;border-right:1px solid #222;font-size:11px;cursor:pointer}.d.on{background:#0f0;color:#000;font-weight:900}.lg{background:#0f0;color:#000;padding:7px;font-weight:900;font-size:12px;display:flex;justify-content:space-between}.m{background:#111;padding:12px;border-bottom:1px solid #222;display:flex;justify-content:space-between;cursor:pointer}.m:hover{background:#1a1a1a}.score{font-weight:900;text-align:right}.live{background:#f00;color:#fff;padding:2px 6px;border-radius:3px;font-size:10px;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}</style></head><body>
<div class="top"><b>KINGDOM <span style="color:#fff">26/27</span></b><b style="color:#0f0">MATT 6:33</b></div>
<div class="d-bar" id="db"></div>
<div id="c" style="padding:20px;text-align:center;color:#0f0">Loading KINGDOM...</div>
<script>
let cur=new Date().toISOString().split('T')[0],all=[];
function build(){let h='';for(let i=-2;i<=4;i++){let d=new Date();d.setDate(d.getDate()+i);let s=d.toISOString().split('T')[0];let lab=s===new Date().toISOString().split('T')[0]?'TODAY':d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit'});let on=s===cur?'on':'';h+=`<div class="d ${on}" onclick="pick('${s}')">${lab}</div>`}db.innerHTML=h}
function pick(s){cur=s;build();load()}
async function load(){c.innerHTML='Loading...';try{let r=await fetch('/api/fixtures?date='+cur);let j=await r.json();all=j.response||[];let by={};all.forEach(x=>{let k=x.league.country+'-'+x.league.name;if(!by[k])by[k]=[];by[k].push(x)});let html='';Object.keys(by).forEach(k=>{let g=by[k];html+=`<div class="lg"><span>${g[0].league.country} - ${g[0].league.name}</span><span>TABLE</span></div>`;g.forEach(m=>{let isLive=(m.status||'').includes('LIVE')||m.status?.includes('H');let sc=`${m.goals.home??0}-${m.goals.away??0}`;let badge=m.status==='FT'?sc+' FT':isLive?`<span style="color:#0f0">${sc}</span> <span class="live">${m.status}</span>`:m.time||m.status;html+=`<div class="m" onclick="openM('${m.id}')"><div>${m.teams.home.name}<br>${m.teams.away.name}</div><div class="score">${badge}</div></div>`})});c.innerHTML=html||'No games for '+cur+'<br>'+all.length+' total games'}catch(e){c.innerHTML='Error: '+e.message}}
function openM(id){let m=all.find(x=>x.id==id);if(!m)return;alert(m.teams.home.name+' vs '+m.teams.away.name+'\nScore: '+(m.goals.home??0)+'-'+(m.goals.away??0)+'\nStatus: '+m.status+'\nLeague: '+m.league.name+'\n\nTap OK - Modal with Havertz/Salah demo go show when summary API ready')}
build();load();setInterval(load,60000);
</script></body></html>
