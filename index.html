<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore TOP A-Z</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#00c853;padding:12px;font-weight:900;color:#000;display:flex;justify-content:space-between}
.header a{background:#fff;color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:12px}
.tabs{display:flex;background:#121212;overflow:auto}
.tabs button{background:#121212;color:#888;border:0;padding:12px;flex:1;font-weight:900;min-width:80px}
.tabs button.active{color:#00ff66;border-bottom:3px solid #00c853}
.filter{display:flex;gap:8px;padding:10px;background:#0f0f0f}
.filter button{background:#222;color:#aaa;border:1px solid #333;padding:8px 16px;border-radius:20px}
.filter button.active{background:#00c853;color:#000;font-weight:900}
.league-head{background:#00c853;color:#000;padding:8px 12px;font-weight:900;margin-top:10px;font-size:13px}
.match{display:flex;align-items:center;padding:14px;background:#151515;margin:6px 8px;border-radius:10px;border-left:4px solid #00c853;cursor:pointer}
.time{border:2px solid #00c853;border-radius:20px;padding:6px 12px;color:#00c853;font-weight:900;font-size:12px;min-width:75px;text-align:center}
.teams{flex:1;margin-left:12px;line-height:20px}
.score{color:#00ff66;font-weight:900;font-size:18px}
</style>
</head>
<body>
<div class="header"><span>⚽ LiveScore TOP A-Z</span><a href="#" onclick="location.reload();return false;">↻ Refresh</a></div>
<div class="tabs" id="dateTabs"></div>
<div class="filter">
<button id="f-all" class="active" onclick="setFilter('all')">All</button>
<button id="f-live" onclick="setFilter('live')">Live</button>
<button id="f-fin" onclick="setFilter('finished')">Finished</button>
</div>
<div id="list" style="padding:20px;text-align:center">Loading...</div>
<script>
let all=[],cur='all',curDate='';
const TOP_ORDER=[
  {key:'CHAMPIONS LEAGUE',pri:1,zone:'EUROPE'},
  {key:'EUROPA LEAGUE',pri:2,zone:'EUROPE',not:'CONFERENCE'},
  {key:'CONFERENCE LEAGUE',pri:3,zone:'EUROPE'},
  {key:'PREMIER LEAGUE',zone:'ENGLAND',pri:4},
  {key:'LALIGA',pri:5,zone:'SPAIN'},{key:'LA LIGA',pri:5,zone:'SPAIN'},
  {key:'LIGUE 1',zone:'FRANCE',pri:6},
  {key:'BUNDESLIGA',zone:'GERMANY',pri:7},
  {key:'SERIE A',zone:'ITALY',pri:8},
  {key:'EREDIVISIE',zone:'NETHERLANDS',pri:9},
  {key:'PRIMEIRA LIGA',zone:'PORTUGAL',pri:10},
  {key:'PRIMEIRA',zone:'PORTUGAL',pri:10}
];
function getPriority(zone,leagueName){
  let full=(zone+' - '+leagueName).toUpperCase();
  let z=(zone||'').toUpperCase();
  // FIX: Asia should NOT get TOP pri, put in A-Z
  if(z.includes('ASIA')) return 100;
  for(let t of TOP_ORDER){
    if(t.not&&full.includes(t.not)) continue;
    if(t.zone&&!z.includes(t.zone)&&!full.includes(t.zone)) continue;
    if(full.includes(t.key)) return t.pri;
  }
  if(z.includes('EUROPE')) return 15;
  return 100;
}
function tabs(){let h='',t=new Date();for(let i=-2;i<=2;i++){let d=new Date(t);d.setDate(t.getDate()+i);let ds=d.toISOString().split('T')[0];let lb=i==-1?'Yesterday':i==0?'Today':i==1?'Tomorrow':d.toLocaleDateString('en',{month:'short',day:'numeric'});let ac=i==0?'active':'';h+=`<button class="${ac}" onclick="goDate('${ds}',this)">${lb}</button>`}document.getElementById('dateTabs').innerHTML=h}
function goDate(ds,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');load(ds)}
async function load(d){
 curDate=d;
 document.getElementById('list').innerHTML='Loading '+d+'...';
 try{
  let r=null,j=null;
  try{r=await fetch('/api/fixtures?date='+d);j=await r.json();}catch(e){}
  if(!j||!j.data){try{r=await fetch('/api/fixtures/date/'+d);j=await r.json();}catch(e){}}
  if(!j||!j.data){try{r=await fetch('/fixtures?date='+d);j=await r.json();}catch(e){}}
  all=j?.data||j?.fixtures||[];
  if(!all.length) throw new Error('No data');
  show();
 }catch(e){
  document.getElementById('list').innerHTML='<div style="color:#888">No matches for '+d+'<br>'+e.message+'</div>';
  all=[];
 }
}
function openMatch(id){
  try{
    localStorage.setItem('mid',String(id));
    let m=all.find(x=>String(x.id)==String(id));
    if(m) localStorage.setItem('selected_match',JSON.stringify(m));
  }catch(e){}
  window.location.href='/match.html?id='+encodeURIComponent(id)+'&date='+encodeURIComponent(curDate);
}
function setFilter(f){cur=f;document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));document.getElementById('f-'+(f=='finished'?'fin':f)).classList.add('active');show()}
function getCorrectTime(m){
 let st=(m.status||'').toUpperCase();
 if(st==='LIVE') return {t:m.minute||'LIVE',c:'#ff3b30'};
 if(st==='HT') return {t:'HT',c:'#ff9500'};
 if(st==='FT'||st==='AET'||st==='PENS') return {t:st,c:'#00c853'};
 let time='NS';
 try{
  if(m.kickoff_utc) time=new Date(m.kickoff_utc).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'});
  else if(m.datetime) time=m.datetime.split(' ')[1]?.substring(0,5)||'NS';
 }catch(e){time=m.datetime?.split(' ')[1]?.substring(0,5)||'NS';}
 return {t:time,c:'#00c853'};
}
function show(){
 let data=[...all];
 if(cur=='live') data=data.filter(x=>['LIVE','HT'].includes((x.status||'').toUpperCase()));
 if(cur=='finished') data=data.filter(x=>['FT','AET','PENS'].includes((x.status||'').toUpperCase()));
 if(!data.length){document.getElementById('list').innerHTML='No matches '+cur+' for '+curDate;return}
 let g={};
 data.forEach(m=>{
  let k=(m.league_zone||'EUROPE')+' - '+m.league_name;
  if(!g[k]) g[k]={name:k,pri:getPriority(m.league_zone,m.league_name),games:[]};
  g[k].games.push(m);
 });
 let keys=Object.keys(g).sort((a,b)=>{if(g[a].pri!=g[b].pri) return g[a].pri-g[b].pri;return a.localeCompare(b)});
 let html='';
 keys.forEach(k=>{
  let gr=g[k];
  gr.games.sort((a,b)=>(a.datetime||'').localeCompare(b.datetime||''));
  html+='<div class="league-head">'+gr.name+' ('+gr.games.length+')</div>';
  gr.games.forEach(x=>{
   let sc=x.home_score!=null?x.home_score+' - '+x.away_score:'- : -';
   let tm=getCorrectTime(x);
   html+='<div class="match" onclick="openMatch(\''+x.id+'\')"><div class="time" style="color:'+tm.c+';border-color:'+tm.c+'">'+tm.t+'</div><div class="teams"><div>'+x.home_team+'</div><div>'+x.away_team+'</div></div><div class="score">'+sc+'</div></div>';
  });
 });
 document.getElementById('list').innerHTML=html;
}
tabs();load(new Date().toISOString().split('T')[0]);
</script>
</body>
</html>
