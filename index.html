<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kingdom Livescore 2026/27</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f1419;color:#fff}
header{background:#1a2530;padding:12px 15px;display:flex;justify-content:space-between;border-bottom:2px solid #00c853;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:20px;color:#00c853}.logo span{color:#fff}
.live-dot{background:#ff3b30;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tabs{display:flex;background:#131d27;border-bottom:1px solid #1e2e3e;position:sticky;top:52px;z-index:10}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{border-bottom:2px solid #00c853;color:#00c853;background:#1a2530}
.search{background:#131d27;padding:10px 15px}
.search input{width:100%;padding:10px;border-radius:20px;border:1px solid #2a3a4a;background:#1e2e3e;color:#fff;outline:none}
.verse{background:#00c853;color:#000;padding:6px 15px;text-align:center;font-size:11px;font-weight:700}
.league{background:#1e2e3e;padding:10px 15px;font-weight:700;font-size:13px;border-top:1px solid #2a3a4a;display:flex;justify-content:space-between;cursor:pointer}
.league:hover{background:#2a3a4a;color:#00c853}
.match{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid #1e2e3e;font-size:14px;cursor:pointer;background:#131d27}
.match:hover{background:#1e2e3e} .match.live{border-left:3px solid #ff3b30}
.time{width:60px;font-size:12px;color:#00c853;font-weight:700}
.teams{flex:1}.team{display:flex;justify-content:space-between;padding:1px 0}
.score{font-weight:700;background:#2a3a4a;padding:1px 6px;border-radius:3px;min-width:24px;text-align:center}
.status{width:45px;text-align:right;font-size:11px;color:#ff3b30}
.loading{text-align:center;padding:40px;color:#8b9bb4}
.refresh{position:fixed;bottom:20px;right:20px;background:#00c853;color:#000;width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer;z-index:50}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;align-items:flex-end}
#modal.show{display:flex}
.modal-box{background:#131d27;width:100%;max-height:90vh;border-radius:20px 20px 0 0;overflow:auto;border-top:2px solid #00c853}
.modal-head{padding:15px;display:flex;justify-content:space-between;align-items:center;background:#1a2530;position:sticky;top:0}
.modal-head button{background:#2a3a4a;color:#fff;border:0;padding:6px 12px;border-radius:10px}
.stat-row{display:flex;justify-content:space-between;padding:8px;background:#0f1419;border-radius:8px;margin:5px 0;font-size:13px}
</style>
</head>
<body>
<header><div class="logo">KINGDOM <span>2026/27</span></div><div class="live-dot" id="count">● REAL LIVE</div></header>
<div class="verse">📖 Tap LEAGUE for table - Tap MATCH for stats - Matt 6:33</div>
<div class="tabs">
<div class="tab active" onclick="switchTab('live',this)">LIVE</div>
<div class="tab" onclick="switchTab('today',this)">TODAY</div>
<div class="tab" onclick="switchTab('finished',this)">FT</div>
<div class="tab" onclick="openTable()">TABLE</div>
</div>
<div class="search"><input id="search" placeholder="🔍 Search team..." onkeyup="searchTeam()"></div>
<div id="content"><div class="loading">⏳ Loading...</div></div>
<div class="refresh" onclick="load()">↻</div>
<div id="modal" onclick="if(event.target==this)closeModal()"><div class="modal-box"><div class="modal-head"><div id="modalTitle">Details</div><button onclick="closeModal()">X Close</button></div><div id="modalBody" style="padding:15px">Loading...</div></div></div>
<script>
let current='today';
async function load(){
 let c=document.getElementById('content');
 c.innerHTML='<div class=loading>⏳ Loading '+current.toUpperCase()+'...</div>';
 try{
  let r=await fetch('/api/live?type='+current);
  let d=await r.json();
  let f = Array.isArray(d) ? d : (d.data||d.response||[]);
  if(!Array.isArray(f)) f=[];
  let filtered=f;
  if(current==='live') filtered=f.filter(m=>['First half','Second half','Halftime'].includes(m.state?.description));
  if(current==='finished') filtered=f.filter(m=>m.state?.description==='Finished');
  document.getElementById('count').innerText='● '+filtered.length+' '+current.toUpperCase();
  if(filtered.length===0){c.innerHTML='<div class=loading>No '+current+' games</div>';return}
  render(filtered)
 }catch(e){c.innerHTML='<div class=loading>Error '+e.message+'</div>'}
}
function render(fixtures){
 let groups={};
 fixtures.forEach(x=>{let k=x.league?.name||'Football'; if(!groups[k]) groups[k]=[]; groups[k].push(x)});
 let h='';
 for(let k in groups){
  let safeK = k.replace(/'/g,'').replace(/"/g,'');
  h+=`<div class="league" onclick="openTable('${safeK}')"><span>🏆 ${k} 👉 TABLE</span><span>${groups[k].length} ⚽</span></div>`;
  groups[k].forEach(f=>{
   let home=f.homeTeam?.name||'Home'; let away=f.awayTeam?.name||'Away';
   let sc=f.state?.score?.current||f.state?.score||{}; let hs=sc?.home??0; let as=sc?.away??0;
   let time=String(f.state?.clock??f.state?.description??'NS');
   let status=String(f.state?.description||'NS');
   let isLive=['First half','Second half','Halftime'].includes(f.state?.description);
   let mid=f.id||'';
   h+=`<div class="match ${isLive?'live':''}" onclick="openMatch('${mid}','${home.replace(/'/g,'')}','${away.replace(/'/g,'')}','${k.replace(/'/g,'')}')"><div class="time">${time.substring(0,12)}</div><div class="teams"><div class="team"><span>${home}</span><span class="score">${hs}</span></div><div class="team"><span>${away}</span><span class="score">${as}</span></div></div><div class="status">${status.substring(0,5)}</div></div>`
  })
 }
 document.getElementById('content').innerHTML=h;
}
function switchTab(t,el){current=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');load()}
function searchTeam(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.match').forEach(m=>{m.style.display=m.innerText.toLowerCase().includes(q)?'flex':'none'})}
async function openMatch(id,home,away,league){
 document.getElementById('modal').classList.add('show');
 document.getElementById('modalTitle').innerText=league;
 document.getElementById('modalBody').innerHTML=`<div style="text-align:center"><div style="font-size:22px;font-weight:900">${home}<br>vs<br>${away}</div><div style="color:#8b9bb4">${league}</div><div style="margin-top:20px">⏳ Loading Match Center...</div></div>`;
 if(!id) return;
 try{
  let r=await fetch('/api/match?id='+id);
  let d=await r.json();
  let data = d.data || d || {};
  // Sometimes API returns array with 1 item
  if(Array.isArray(data)) data = data[0]||{};
  if(d.data && Array.isArray(d.data)) data = d.data[0]||d.data;
  
  let venue = data.venue?.name || data.venue || 'Stadium';
  let country = data.venue?.country || '';
  let referee = data.referee?.name || 'TBD';
  let weather = data.forecast ? `${data.forecast.status||''} ${data.forecast.temperature||''}` : '';
  let predictions = data.predictions||[];
  let events = data.events||[];
  let stats = data.statistics||[];

  let html = `<div style="text-align:center;padding:10px"><div style="font-size:24px;font-weight:900">${home} vs ${away}</div><div style="color:#8b9bb4">${league}</div>
  <div style="background:#1e2e3e;padding:12px;border-radius:12px;margin-top:12px;font-size:12px;text-align:left">
  <div>🏟️ ${venue} ${country?'- '+country:''}</div>
  <div style="margin-top:4px">👨‍⚖️ Referee: ${referee}</div>
  ${weather?`<div style="margin-top:4px">🌦️ ${weather}</div>`:''}
  </div></div>`;

  if(predictions.length>0){
    html+=`<div style="margin-top:15px"><b>🔮 Predictions</b>`;
    predictions.slice(0,2).forEach(p=>{
      html+=`<div class="stat-row"><span>${p.description||p.type}</span><span style="color:#00c853">${JSON.stringify(p.probabilities||'')}</span></div>`;
    });
    html+=`</div>`;
  }
  if(events.length>0){
    html+=`<div style="margin-top:15px"><b>⚽ Events (${events.length})</b>`;
    events.slice(-8).forEach(ev=>{
      html+=`<div class="stat-row"><span>${ev.minute||''}' ${ev.type||''} - ${ev.player?.name||''}</span><span>${ev.team?.name?.substring(0,10)||''}</span></div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div style="margin-top:15px;background:#0f1419;padding:12px;border-radius:10px;font-size:13px;color:#8b9bb4;text-align:center">📊 Match Center<br>Score updates every 60s<br>${data.state?.description||''} - ${data.state?.score?.current?.home||0} : ${data.state?.score?.current?.away||0}<br><br>Stats & Lineups loading...</div>`;
  }
  html+=`<div style="margin-top:15px;font-size:10px;color:#444;word-break:break-all;background:#0f1419;padding:8px;border-radius:8px">ID: ${id}</div>`;
  
  document.getElementById('modalBody').innerHTML=html;
 }catch(e){
  document.getElementById('modalBody').innerHTML='Error '+e.message;
 }
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function openTable(leagueName){
 if(!leagueName) leagueName=prompt("Type league:\nPremier League\nLa Liga\nSerie A\nBundesliga","Premier League");
 if(!leagueName) return;
 document.getElementById('content').innerHTML='<div class=loading>⏳ Loading '+leagueName+' TABLE...</div>';
 try{
  let r=await fetch('/api/table?leagueName='+encodeURIComponent(leagueName));
  let d=await r.json();
  let table=d.data||d.response||d.standings||d;
  if(Array.isArray(table)&&table[0]?.standings) table=table[0].standings;
  if(table?.standings) table=table.standings;
  let html=`<div class=league onclick="load()"><span>⬅ Back to games</span><span>${leagueName} Table</span></div>`;
  (table||[]).forEach((t,i)=>{let rank=t.position||i+1; let name=t.team?.name||t.name||'Team'; let pts=t.points||0; let pl=t.played||0; html+=`<div class="match"><div style="width:30px">${rank}</div><div style="flex:1">${name}</div><div>${pl} GP</div><div style="width:35px;font-weight:900;margin-left:10px">${pts}</div></div>`});
  document.getElementById('content').innerHTML=html;
 }catch(e){document.getElementById('content').innerHTML='<div class=loading>Error</div>'}
}
load();setInterval(load,60000);
</script>
</body>
</html>
