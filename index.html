<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KINGDOM 2026/27</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;font-weight:600}
.top{background:#000;border-bottom:3px solid #00ff00;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:22px}
.logo span{color:#00ff00}
.date-bar{background:#111;display:flex;overflow-x:auto;border-bottom:2px solid #00ff00;position:sticky;top:51px;z-index:15}
.date-bar::-webkit-scrollbar{display:none}
.d{padding:12px 14px;min-width:78px;text-align:center;cursor:pointer;border-right:1px solid #222;font-size:12px;white-space:nowrap}
.d.active{background:#00ff00;color:#000;font-weight:900}
.d small{display:block;font-size:10px;margin-top:2px}
.filter-bar{background:#0a0a0a;display:flex;overflow-x:auto;border-bottom:1px solid #222;position:sticky;top:91px;z-index:14}
.f{padding:12px 18px;cursor:pointer;font-size:12px;font-weight:800;color:#888;white-space:nowrap;border-bottom:3px solid transparent}
.f.active{color:#00ff00;border-bottom-color:#00ff00;background:rgba(0,255,0,.08)}
.country-league{background:#00ff00;color:#000;padding:8px 12px;font-weight:900;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:2px}
.country-league span:last-child{background:#000;color:#00ff00;padding:3px 8px;border-radius:10px;font-size:10px}
.match{background:#111;padding:10px 12px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.match:active{background:#1a1a1a}
.teams{flex:1;font-size:13px;line-height:18px}
.teams b{font-weight:800}
.score-box{background:#000;border:1px solid #00ff00;color:#00ff00;padding:5px 10px;border-radius:6px;font-weight:900;min-width:52px;text-align:center;font-size:13px}
.score-box.ns{background:#222;border-color:#444;color:#888}
.score-box.live{background:#ff0000;border-color:#ff0000;color:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.refresh-btn{background:#00ff00;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:900;cursor:pointer;margin:10px auto;display:block}
.table-wrap{background:#111;margin:10px;border-radius:10px;overflow:hidden;border:1px solid #222}
.team-row{display:grid;grid-template-columns:30px 1fr 28px 32px 40px;gap:6px;padding:11px 10px;border-bottom:1px solid #222;font-size:12px;align-items:center}
#modal{position:fixed;inset:0;background:#000;z-index:100;display:none;overflow:auto}
</style>
</head>
<body>
<div class="top"><div class="logo">KINGDOM <span>26/27</span></div><div style="font-size:11px;font-weight:900;color:#00ff00">MATT 6:33 • KINGDOM</div></div>
<div class="date-bar" id="dateBar"></div>
<div class="filter-bar">
  <div class="f active" data-f="all" onclick="setFilter('all')">ALL GAMES</div>
  <div class="f" data-f="live" onclick="setFilter('live')">LIVE 🔴</div>
  <div class="f" data-f="finished" onclick="setFilter('finished')">FINISHED</div>
  <div class="f" data-f="refresh" onclick="refreshNow()" style="color:#00ff00">REFRESH 🔄</div>
</div>
<div id="content"></div>
<div id="modal"><div style="background:#000;border-bottom:2px solid #00ff00;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0"><span onclick="closeModal()" style="color:#00ff00;font-weight:900;cursor:pointer">⬅ KINGDOM</span><span style="font-weight:900;font-size:11px">KINGDOM CENTER</span><span onclick="closeModal()" style="color:#888;cursor:pointer">✕</span></div><div id="modalContent"></div></div>
<script>
let currentDateStr=new Date().toISOString().split('T')[0];
let currentFilter='all';
let allMatchesCache=[];

function buildDateBar(){
  const bar=document.getElementById('dateBar');
  let html='';
  for(let i=-2;i<=2;i++){
    let d=new Date(); d.setDate(d.getDate()+i);
    let str=d.toISOString().split('T')[0];
    let isToday=str===new Date().toISOString().split('T')[0];
    let active=str===currentDateStr?'active':'';
    html+=`<div class="d ${active}" data-date="${str}" onclick="pickDate('${str}')"><b>${isToday?'TODAY':d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}</b><small>${d.getDate()}/${d.getMonth()+1} ${isToday?'•':''}</small></div>`;
  }
  bar.innerHTML=html;
}
function pickDate(str){ currentDateStr=str; document.querySelectorAll('.d').forEach(el=>el.classList.remove('active')); document.querySelector(`[data-date="${str}"]`)?.classList.add('active'); loadGames(); }
function setFilter(f){ if(f==='refresh'){refreshNow();return;} currentFilter=f; document.querySelectorAll('.f').forEach(el=>el.classList.remove('active')); document.querySelector(`[data-f="${f}"]`)?.classList.add('active'); renderMatches(); }
function refreshNow(){ let btn=document.querySelector('[data-f="refresh"]'); let old=btn.innerHTML; btn.innerHTML='LOADING...'; loadGames().then(()=>{btn.innerHTML='REFRESHED ✅'; setTimeout(()=>btn.innerHTML=old,1500);}); if(navigator.vibrate) navigator.vibrate([100,50,100]); }

async function loadGames(){
  const content=document.getElementById('content');
  content.innerHTML=`<div style="padding:30px;text-align:center;color:#00ff00">⏳ Loading ${currentDateStr}...<br><small style="color:#888">KINGDOM APISPORT</small></div>`;
  try{
    let res=await fetch(`/api/fixtures?date=${currentDateStr}`);
    let json=await res.json();
    let matches=json.response||json.data||[];
    allMatchesCache=matches;
    renderMatches();
  }catch(e){ content.innerHTML=`<div style="padding:20px;color:#ff4444">Error: ${e.message}<br><button class="refresh-btn" onclick="loadGames()">RETRY</button></div>`; }
}

function renderMatches(){
  const content=document.getElementById('content');
  if(!allMatchesCache.length){ content.innerHTML=`<div style="padding:30px;text-align:center;color:#888">No games for ${currentDateStr}<br><button class="refresh-btn" onclick="loadGames()">REFRESH 🔄</button></div>`; return; }
  
  let filtered=allMatchesCache;
  if(currentFilter==='live') filtered=allMatchesCache.filter(m=> (m.status||'').toUpperCase()==='2H' || (m.status||'').toUpperCase()==='1H' || (m.status||'').toLowerCase().includes('live'));
  if(currentFilter==='finished') filtered=allMatchesCache.filter(m=> (m.status||'').toUpperCase()==='FT');
  
  // REMOVE FAKE 0:0 FT MATCHES WHERE SCORE IS NULL
  filtered = filtered.filter(m=>{
    let hs = m.goals?.home;
    let as = m.goals?.away;
    let st = (m.status||'').toUpperCase();
    // If FT and both null, it's fake - hide it (like Qsa Quartiere etc from your screenshot)
    if(st==='FT' && (hs===null || hs===undefined) && (as===null || as===undefined)){
      return false;
    }
    return true;
  });

  let grouped={};
  filtered.forEach(m=>{
    let country=(m.league?.country||'World').replace(' Amateur','').trim();
    let league=m.league?.name||'League';
    let key=`${country}__${league}__${m.league?.slug||'premier-league'}`;
    if(!grouped[key]) grouped[key]={country,league,slug:m.league?.slug||'premier-league',matches:[]};
    grouped[key].matches.push(m);
  });
  
  let html=`<div style="padding:8px 12px;font-size:11px;color:#00ff00;font-weight:800;display:flex;justify-content:space-between"><span>${currentDateStr} • ${filtered.length} GAMES - REAL SCORES</span><span style="color:#888" onclick="loadGames()">REFRESH NOW 🔄</span></div>`;
  
  Object.values(grouped).forEach(g=>{
    html+=`<div class="country-league" onclick="openTable('${g.slug}','${g.league.replace(/'/g,'')}','${g.country}')"><span>${g.country.toUpperCase()}: ${g.league.toUpperCase()}</span><span>TABLE →</span></div>`;
    g.matches.slice(0,20).forEach(m=>{
      let home=m.teams?.home?.name||'Home'; 
      let away=m.teams?.away?.name||'Away';
      let hs=m.goals?.home; 
      let as=m.goals?.away; 
      let status=(m.status||'FT').toUpperCase();
      let time=m.time || '';
      
      let scoreText='';
      let scoreClass='score-box';
      
      if(status==='NS'){
        scoreText = time || 'vs';
        scoreClass += ' ns';
        status = time || 'NS';
      } else if(status==='1H' || status==='2H'){
        if(hs!==null && as!==null) scoreText = `${hs} : ${as}`;
        else scoreText = `${m.elapsed||''}'`;
        scoreClass += ' live';
      } else { // FT
        if(hs!==null && as!==null) scoreText = `${hs} : ${as}`;
        else scoreText = 'FT'; // should not happen after filter
      }
      
      html+=`<div class="match"><div style="font-size:10px;color:${status.includes(':')?'#888':'#00ff00'};font-weight:900;min-width:50px">${status}</div><div class="teams"><div><b>${home}</b></div><div style="color:#888">${away}</div></div><div class="${scoreClass}">${scoreText}</div></div>`;
    });
  });
  html+=`<button class="refresh-btn" onclick="loadGames()">REFRESH 🔄 KINGDOM</button>`;
  content.innerHTML=html;
}

async function openTable(slug,name,country){
  const content=document.getElementById('content');
  content.innerHTML=`<div style="background:#000;border-bottom:2px solid #00ff00;padding:10px;display:flex;justify-content:space-between"><span style="color:#00ff00;font-weight:900;cursor:pointer" onclick="loadGames()">⬅ BACK TO GAMES</span><span style="font-weight:900;font-size:11px">${country.toUpperCase()}: ${name.toUpperCase()}</span><span style="color:#888;font-size:11px" onclick="loadGames()">REFRESH</span></div><div style="background:#00ff00;color:#000;padding:12px;text-align:center;font-weight:900">${country.toUpperCase()}: ${name.toUpperCase()} - STANDINGS<br><small style="font-size:10px">KINGDOM 2026/27 • GREEN BLACK</small></div><div style="padding:20px;text-align:center;color:#00ff00">⏳ Loading...</div>`;
  try{
    let res=await fetch(`/api/table?leagueName=${slug}`);
    let json=await res.json();
    let table=json.response||[];
    if(!table.length){ content.innerHTML=`<div style="padding:20px;text-align:center">No table for ${name}<br><br><button class="refresh-btn" onclick="loadGames()">BACK TO GAMES</button></div>`; return; }
    let html=`<div style="background:#000;border-bottom:2px solid #00ff00;padding:10px;display:flex;justify-content:space-between"><span style="color:#00ff00;font-weight:900;cursor:pointer" onclick="loadGames()">⬅ BACK TO GAMES</span><span style="font-weight:900;font-size:11px">${country.toUpperCase()}: ${name.toUpperCase()} - STANDINGS</span><span style="color:#00ff00;font-size:11px;font-weight:900">REFRESH NOW</span></div><div style="background:#111;padding:6px;display:grid;grid-template-columns:30px 1fr 28px 28px 28px 28px 40px 40px;gap:4px;font-size:11px;font-weight:900;color:#00ff00;border-bottom:1px solid #00ff00"><span>#</span><span>TEAM</span><span>MP</span><span>W</span><span>D</span><span>L</span><span>G</span><span>PTS</span></div><div class="table-wrap" style="margin:0;border-radius:0;border:none">`;
    table.forEach(r=>{
      html+=`<div class="team-row" style="grid-template-columns:30px 1fr 28px 28px 28px 28px 40px 40px;background:#000;color:#fff"><span style="color:${r.rank<=4?'#00ff00':r.rank>=18?'#ff4444':'#fff'};font-weight:900">${r.rank}</span><span style="font-weight:800">${r.team.name.toUpperCase()}</span><span>${r.played||0}</span><span>${r.won||0}</span><span>${r.drawn||0}</span><span>${r.lost||0}</span><span>${(r.goalsFor||0)}:${(r.goalsAgainst||0)}</span><span style="color:#00ff00;font-weight:900">${r.points}</span></div>`;
    });
    html+=`</div>`;
    content.innerHTML=html;
  }catch(e){ content.innerHTML=`Error: ${e.message}<br><button class="refresh-btn" onclick="loadGames()">BACK TO GAMES</button>`; }
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
buildDateBar(); loadGames();
</script>
</body>
</html>
